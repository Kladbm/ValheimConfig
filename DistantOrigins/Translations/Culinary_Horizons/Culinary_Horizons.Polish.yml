#_Unprocessed_Elite_Spices_#

item_spice_unprocessed_elite_eldakras_CH: "Surowa Eldakras"
item_spice_unprocessed_elite_eldakras_description_CH: "Potężna zielona poświata otacza tę przyprawę, obiecując mnóstwo smaków."

item_spice_unprocessed_elite_marshmas_CH: "Surowa Marshmas"
item_spice_unprocessed_elite_marshmas_description_CH: "Ciemna i omszała, Marshmas pozostawi trwałe wrażenie na każdym wikingu."

item_spice_unprocessed_elite_vindfros_CH: "Surowa Vindfros"
item_spice_unprocessed_elite_vindfros_description_CH: "Sama Moder użyłaby tego do swoich posiłków, gdyby umiała gotować."

item_spice_unprocessed_elite_solakras_CH: "Surowa Solakras"
item_spice_unprocessed_elite_solakras_description_CH: "W swojej surowej postaci Solakras ma słoneczną i w jakiś sposób radosną naturę."

item_spice_unprocessed_elite_mistilteig_CH: "Surowa Mistilteig"
item_spice_unprocessed_elite_mistilteig_description_CH: "Nawet w surowej postaci, sok Yggdrasil sączy się przez tę przyprawę."

item_spice_unprocessed_elite_Alvmas_CH: "Surowa Alvmas"
item_spice_unprocessed_elite_Alvmas_description_CH: "Gęsta jak lawa, ta surowa przyprawa będzie wymagać dokładnego zmielenia."

