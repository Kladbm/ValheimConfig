item_banquet_meadows_feast_buff_CH: "Uczta Pierwszych Lądów"
se_banquet_meadows_feast_buff_tooltip_CH: "Łąki są domem dla wszystkich wygód dziesiątego królestwa, ten półmisek służy jako przypomnienie, aby czasami zrobić sobie przerwę i cieszyć się życiem."

item_banquet_blackforest_pinevegetables_buff_CH: "Warzywa Wędzone na Sośnie"
se_banquet_blackforest_pinevegetables_buff_tooltip_CH: "Zbiór grzybów i marchewek wędzonych na sosnowym kłodzie. Po zjedzeniu twoje ramiona poczują przypływ energii, który mógłby zrównać z ziemią las."

item_banquet_blackforest_sap_buff_CH: "Nasycony Sok Starszego"
se_banquet_blackforest_sap_buff_tooltip_CH: "Ten sok działa jak brama do morza wspomnień Starszego, każda porcja opowiada inną historię i pozostawia cię z przypływem motywacji."

item_banquet_swamp_pork_buff_CH: "Soczyste Żeberka Wieprzowe"
