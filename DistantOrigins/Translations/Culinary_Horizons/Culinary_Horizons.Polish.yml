item_spice_processed_elite_eldakras_CH: "Eldakras"
item_spice_processed_elite_eldakras_description_CH: "Teraz przetworzona, ta przyprawa ma kuszący aromat, który zmieni każde danie w arcydzieło."

item_spice_processed_elite_marshmas_CH: "Marshmas"
item_spice_processed_elite_marshmas_description_CH: "Ciemna i omszała, Marshmas pozostawi trwałe wrażenie na każdym wikingu."

item_spice_processed_elite_vindfros_CH: "Vindfros"
item_spice_processed_elite_vindfros_description_CH: "Sama Moder użyłaby tego do swoich posiłków, gdyby umiała gotować."

item_spice_processed_elite_solakras_CH: "Solakras"
