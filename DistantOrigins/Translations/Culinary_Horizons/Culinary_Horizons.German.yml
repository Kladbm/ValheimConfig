item_enhanced_infusedcookedharemeat_CH: "Infundiertes Gebratenes Hasenfleisch"
item_enhanced_infusedcookedharemeat_description_CH: "Ein mageres und zartes Stück Hasenfleisch, umhüllt von einem leichten violetten Schimmer."

item_enhanced_infusedcookedseekermeat_CH: "Infundiertes Gebratenes Sucherfleisch"
item_enhanced_infusedcookedseekermeat_description_CH: "Die weiche und dennoch knusprige Textur dieses Sucherfleisches zergeht förmlich auf der Zunge."

item_enhanced_scorchedcookedvolturemeat_CH: "Angesengtes Gebratenes Geierfleisch"
item_enhanced_scorchedcookedvolturemeat_description_CH: "Angesengt und glänzend – dieses pralle Fleischstück ist für jeden Wikinger geeignet."

