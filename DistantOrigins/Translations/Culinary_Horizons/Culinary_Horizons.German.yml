item_spice_unprocessed_common_surtlingcinders_description_CH: "Staubige Knochen und Asche klingen in roher Form nicht appetitlich, aber gemahlen verleihen sie eine erdige Textur."

item_spice_unprocessed_common_frostedpowder_CH: "Rohes Frostpulver"
item_spice_unprocessed_common_frostedpowder_description_CH: "Auch im rohen Zustand kann dieses Pulver alles konservieren, was es berührt."

item_spice_unprocessed_common_cracklingflakes_CH: "Rohe Knisterflocken"
item_spice_unprocessed_common_cracklingflakes_description_CH: "Knusprig und würzig, selbst in roher Form."

item_spice_unprocessed_common_shroudedseasonings_CH: "Rohe Verschleierte Würzmischung"
item_spice_unprocessed_common_shroudedseasonings_description_CH: "Ein leichter Nebel zieht über dieses rohe Pulver."

item_spice_unprocessed_common_sorrowfulcinders_CH: "Rohe Traurige Asche"
item_spice_unprocessed_common_sorrowfulcinders_description_CH: "Feurige Glut sprüht aus diesem rohen Gewürz."

#_Processed_Common_Spices_#

item_spice_processed_common_giantsseasoning_CH: "Riesengewürz"
item_spice_processed_common_giantsseasoning_description_CH: "Ein Gewürz, das angeblich von den Jotunn verwendet wurde und einer Mahlzeit einen frischen, kräuterwürzigen Geschmack verleiht."

item_spice_processed_common_surtlingcinders_CH: "Surtling-Asche"
item_spice_processed_common_surtlingcinders_description_CH: "Staubige Knochen und Asche klingen in roher Form nicht appetitlich, verleihen nun aber eine erdige Textur."

item_spice_processed_common_frostedpowder_CH: "Frostpulver"
item_spice_processed_common_frostedpowder_description_CH: "Nun verarbeitet, eignet sich dieses Pulver hervorragend als Konservierungsmittel."

item_spice_processed_common_cracklingflakes_CH: "Knisterflocken"
item_spice_processed_common_cracklingflakes_description_CH: "Jeder Bissen eines mit diesem Gewürz verfeinerten Gerichts sorgt für eine Explosion der Aromen."

item_spice_processed_common_shroudedseasonings_CH: "Verschleierte Würzmischung"
item_spice_processed_common_shroudedseasonings_description_CH: "Dieses Gewürz verleiht jeder Mahlzeit einen vage süßen und beruhigenden Geschmack."

item_spice_processed_common_sorrowfulcinders_CH: "Traurige Asche"
item_spice_processed_common_sorrowfulcinders_description_CH: "Die Schärfe dieses Gewürzes wird jeden Wikinger rot im Gesicht zurücklassen."

#_Unprocessed_Elite_Spices_#

item_spice_unprocessed_elite_eldakras_CH: "Rohes Eldakras"
item_spice_unprocessed_elite_eldakras_description_CH: "Ein kräftiges grünes Leuchten umgibt dieses Gewürz und verspricht eine Fülle von Aromen."

item_spice_unprocessed_elite_marshmas_CH: "Rohes Marshmas"
item_spice_unprocessed_elite_marshmas_description_CH: "Dunkel und moosig – Marshmas hinterlässt bei jedem Wikinger einen bleibenden Eindruck."

item_spice_unprocessed_elite_vindfros_CH: "Rohes Vindfros"
item_spice_unprocessed_elite_vindfros_description_CH: "Moder selbst hätte dies für ihre Mahlzeiten verwendet, wenn sie hätte kochen können."

item_spice_unprocessed_elite_solakras_CH: "Rohes Solakras"
item_spice_unprocessed_elite_solakras_description_CH: "Im rohen Zustand hat Solakras eine sonnige und irgendwie fröhliche Art."

item_spice_unprocessed_elite_mistilteig_CH: "Rohes Mistilteig"
item_spice_unprocessed_elite_mistilteig_description_CH: "Selbst im rohen Zustand sickert der Saft Yggdrasils durch dieses Gewürz."

item_spice_unprocessed_elite_Alvmas_CH: "Rohes Alvmas"
item_spice_unprocessed_elite_Alvmas_description_CH: "So dicht wie Lava – dieses rohe Gewürz muss gründlich gemahlen werden."

#_Processed_Elite_Spices_#

item_spice_processed_elite_eldakras_CH: "Eldakras"
item_spice_processed_elite_eldakras_description_CH: "Nun verarbeitet, verströmt dieses Gewürz ein verlockendes Aroma, das jede Mahlzeit zum Meisterwerk macht."

item_spice_processed_elite_marshmas_CH: "Marshmas"
item_spice_processed_elite_marshmas_description_CH: "Dunkel und moosig – Marshmas hinterlässt bei jedem Wikinger einen bleibenden Eindruck."

item_spice_processed_elite_vindfros_CH: "Vindfros"
item_spice_processed_elite_vindfros_description_CH: "Moder selbst hätte dies für ihre Mahlzeiten verwendet, wenn sie hätte kochen können."

item_spice_processed_elite_solakras_CH: "Solakras"
item_spice_processed_elite_solakras_description_CH: "Vollständig verarbeitet und vorbereitet, wird dieses Gewürz für die feinsten Bankette benötigt."

item_spice_processed_elite_mistilteig_CH: "Mistilteig"
item_spice_processed_elite_mistilteig_description_CH: "Der Saft Yggdrasils durchdringt dieses Gewürz und segnet jede Mahlzeit, der es hinzugefügt wird."

item_spice_processed_elite_Alvmas_CH: "Alvmas"
item_spice_processed_elite_Alvmas_description_CH: "Uralte kulinarische Praktiken scheinen dieses Gewürz durchdrungen zu haben und hinterlassen in jeder Mahlzeit, der es beigefügt wird, einen bleibenden Eindruck."

