#_Unprocessed_Common_Spices_#

item_spice_unprocessed_common_giantsseasoning_CH: "Rohes Riesengewürz"
item_spice_unprocessed_common_giantsseasoning_description_CH: "Ein rohes Gewürz, das angeblich von den Jotunn verwendet wurde und einer Mahlzeit einen frischen, kräuterwürzigen Geschmack verleiht."

