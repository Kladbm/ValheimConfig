item_enhanced_scorchedsmokepuff_CH: "Angesengter Rauchpuff"
item_enhanced_scorchedsmokepuff_description_CH: "Ein angesengter Rauchpuff mit einem schwach warmen Schimmer."

item_enhanced_scorchedmorgenheart_CH: "Angesengtes Morgenherz"
item_enhanced_scorchedmorgenheart_description_CH: "Nun angesengt wird dies eine deftige Mahlzeit sein, aber erwartet nicht, dass es euch mit Energie füllt."

