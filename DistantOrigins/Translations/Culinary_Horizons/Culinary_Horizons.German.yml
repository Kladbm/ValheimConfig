#_Stations_#

piece_station_elderwok_CH: "Elderwok"
piece_station_description_elderwok_CH: "Aus einer langlebigen Legierung geschmiedet, kann der Elderwok in Vergessenheit geratene Rezepte wiederherstellen."

piece_banquetbench_CH: "Bronzeholz-Banketttisch"
piece_banquetbench_description_CH: "Wo ein Koch große Bankette vorbereitet, ausgestattet mit den feinsten Werkzeugen und dem besten Besteck des 10. Reiches."

piece_station_spicetable_CH: "Gewürztisch"
piece_station_spicetable_description_CH: "Ein Tisch zur Herstellung verschiedener gewöhnlicher und edler Gewürze aus Kräutern, die im ganzen Reich gefunden werden."

#_Station_Extensions_#

piece_spicetable_ext1_rackedvials_CH: "Reagenzglasständer"
