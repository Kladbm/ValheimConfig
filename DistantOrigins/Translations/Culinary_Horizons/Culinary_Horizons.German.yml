piece_spicetable_ext2_roastingbasin_CH: "Röstblech"
piece_spicetable_ext2_roastingbasin_description_CH: "Mit sengenden Temperaturen kann dieses Blech nahezu jedes Gewürz rösten, damit es am Gewürztisch verwendet werden kann."

piece_spicetable_ext3_reinforcedsealbreaker_CH: "Verstärkter Siegelbrecher"
piece_spicetable_ext3_reinforcedsealbreaker_description_CH: "Die tropfenden Energiekugeln des Siegelbrechers verwandeln jedes Kraut, das ihnen ausgesetzt wird."

piece_elderwok_ext1_obsidianequipment_CH: "Obsidian-Küchenausstattung"
piece_elderwok_ext1_obsidianequipment_description_CH: "Eine Reihe hängender Schöpflöffel und Kochlöffel zur Unterstützung beim Kochen am Elderwok."

piece_elderwok_ext2_shamanspots_CH: "Schamanentöpfe"
piece_elderwok_ext2_shamanspots_description_CH: "Diese Topfsammlung wurde von den Schamanen der Ebenen inspiriert, um das Kochen am Elderwok zu verbessern."

piece_elderwok_ext3_sharpenedcarapacerazors_CH: "Geschärfte Panzerrasierer"
piece_elderwok_ext3_sharpenedcarapacerazors_description_CH: "Das schärfste Klingenpaar, das jedes Fleisch wie Butter schneidet."

