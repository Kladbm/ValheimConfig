item_enhanced_seededbread_description_CH: "Ein weiches Brot mit einer knusprigen Kruste."

item_enhanced_fishskewer_CH: "Gewürzter Fischspieß"
item_enhanced_fishskewer_description_CH: "Panierte Fischscheiben mit Moltebeeren und Pilzen."

item_enhanced_infusedjotunnpuffs_CH: "Infundierte Jotunn-Puffs"
