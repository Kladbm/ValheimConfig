item_enhanced_charredloxmeat_CH: "Verkohltes Lox-Fleisch"
item_enhanced_charredloxmeat_description_CH: "Eine verkohlte Lox-Keule, überraschend zart beim Essen."

item_enhanced_seededbreaddough_CH: "Gekernter Brotteig"
