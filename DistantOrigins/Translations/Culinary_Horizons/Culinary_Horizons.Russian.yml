item_banquet_meadows_feast_description_CH: "Луга — дом для всех жизненных благ десятого мира, это блюдо служит напоминанием о том, что нужно иногда делать перерыв и наслаждаться жизнью."

item_banquet_blackforest_pinevegetables_CH: "Овощи, копченные на сосне"
item_banquet_blackforest_pinevegetables_description_CH: "Грубый набор грибов и моркови, копченных на сосновом бревне. Съев это, вы почувствуете прилив энергии в руках, достаточный, чтобы свалить лес."

item_banquet_blackforest_sap_CH: "Настоянный сок Древнего"
item_banquet_blackforest_sap_description_CH: "Этот сок действует как врата в море воспоминаний Древнего, каждая порция рассказывает свою историю и дарит прилив мотивации."

item_banquet_swamp_pork_CH: "Сочные свиные обрезки"
item_banquet_swamp_pork_description_CH: "Сосиски, сосиски, сосиски! Викинг с этим блюдом никогда не останется голодным и не падет без боя."

