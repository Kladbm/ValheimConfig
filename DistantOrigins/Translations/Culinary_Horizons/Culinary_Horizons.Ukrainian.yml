#_Stations_#

piece_station_elderwok_CH: "Ельдервок"
piece_station_description_elderwok_CH: "Викуваний із міцного сплаву, Ельдервок може створювати давно забуті рецепти."

piece_banquetbench_CH: "Бенкетний стіл із бронзового дерева"
piece_banquetbench_description_CH: "Місце, де шеф-кухар готує грандіозні бенкети, оснащене найкращими інструментами та столовими приборами десятого царства."

piece_station_spicetable_CH: "Стіл для спецій"
piece_station_spicetable_description_CH: "Стіл для створення різноманітних звичайних та елітних спецій із трав, знайдених по всьому царству."

#_Station_Extensions_#

