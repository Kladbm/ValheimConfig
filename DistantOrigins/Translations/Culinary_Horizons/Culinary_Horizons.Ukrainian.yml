piece_spicetable_ext2_roastingbasin_description_CH: "Завдяки високій температурі це деко може підсмажити майже будь-яку спецію, готову до використання за столом спецій."

piece_spicetable_ext3_reinforcedsealbreaker_CH: "Підсилений розривач печаток"
piece_spicetable_ext3_reinforcedsealbreaker_description_CH: "Краплі енергії, що стікають із розривача печаток, перетворюють будь-яку траву, яка піддається їх впливу."

piece_elderwok_ext1_obsidianequipment_CH: "Кухонне обладнання з обсидіану"
piece_elderwok_ext1_obsidianequipment_description_CH: "Серія підвісних черпаків і ложок, які допомагають у приготуванні їжі на Ельдервоку."

piece_elderwok_ext2_shamanspots_CH: "Шаманські горщики"
piece_elderwok_ext2_shamanspots_description_CH: "Ця колекція горщиків створена за мотивами шаманів Рівнин, щоб покращити ваше приготування їжі на Ельдервоку."

piece_elderwok_ext3_sharpenedcarapacerazors_CH: "Заточені леза з карапаксу"
piece_elderwok_ext3_sharpenedcarapacerazors_description_CH: "Найгостріша пара лез, яка розріже будь-яке м'ясо як масло."

