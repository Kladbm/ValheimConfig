item_forgotten_uncooked_jotunnsbounty_description_CH: "Широкий асортимент м'яса, зібраного в Туманних землях, готовий до приготування."

item_forgotten_cooked_jotunnsbounty_CH: "Здобич Йотуна"
item_forgotten_cooked_jotunnsbounty_description_CH: "Рясне блюдо з ніжного м'яса та шматків, навіть давній Йотун почувався б ситим після його споживання."

item_forgotten_uncooked_seekersupreme_CH: "Неприготовлений найвищий шукач"
item_forgotten_uncooked_seekersupreme_description_CH: "Асорті з ніжних шампурів з м'яса шукача, готових до приготування."

item_forgotten_cooked_seekersupreme_CH: "Найвищий шукач"
item_forgotten_cooked_seekersupreme_description_CH: "Ніжне, соковите та поживне, не дивно, що все блюдо можна з'їсти за один присід."

item_forgotten_gjallsfireybroth_CH: "Вогненний бульйон Ґ'ялла"
item_forgotten_gjallsfireybroth_description_CH: "Тепер ви знаєте, чому Ґ'ялли ревуть крізь тумани."

#_Banquets_#

item_banquet_meadows_feast_CH: "Бенкет Перших Земель"
item_banquet_meadows_feast_description_CH: "Луки — це домівка для всіх життєвих зручностей десятого царства, це блюдо служить нагадуванням про те, що потрібно іноді робити перерву та насолоджуватися життям."

item_banquet_blackforest_pinevegetables_CH: "Овочі, копчені на сосні"
item_banquet_blackforest_pinevegetables_description_CH: "Грубий набір грибів та моркви, копчених на сосновій колоді. З'ївши це, ви відчуєте приплив енергії в руках, достатній, щоб повалити ліс."

item_banquet_blackforest_sap_CH: "Настоєний сік Древнього"
item_banquet_blackforest_sap_description_CH: "Цей сік діє як ворота в море спогадів Древнього, кожна порція розповідає іншу історію та залишає вас із припливом мотивації."

item_banquet_swamp_pork_CH: "Соковиті свинячі обрізки"
item_banquet_swamp_pork_description_CH: "Ковбаски, ковбаски, ковбаски! Вікінг із цим блюдом ніколи не залишиться голодним і не впаде без бою."

