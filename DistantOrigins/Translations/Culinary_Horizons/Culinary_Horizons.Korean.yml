item_spice_processed_common_surtlingcinders_description_CH: "먼지 낀 뼈와 재는 날것 상태에서는 식욕을 돋우지 않지만, 이제 흙내음 나는 식감을 만들어낸다."

item_spice_processed_common_frostedpowder_CH: "서리 가루"
