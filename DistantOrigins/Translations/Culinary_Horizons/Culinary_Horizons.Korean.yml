item_spice_processed_common_shroudedseasonings_CH: "안개 조미료"
item_spice_processed_common_shroudedseasonings_description_CH: "이 향신료는 어떤 음식에도 은은하게 달콤하고 편안한 풍미를 더해준다."

item_spice_processed_common_sorrowfulcinders_CH: "슬픔의 재"
