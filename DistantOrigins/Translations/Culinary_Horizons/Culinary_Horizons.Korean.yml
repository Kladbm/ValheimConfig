piece_elderwok_ext1_obsidianequipment_description_CH: "엘더웍에서의 요리를 돕기 위한 걸이식 국자와 스푼 시리즈."

piece_elderwok_ext2_shamanspots_CH: "샤먼의 솥"
piece_elderwok_ext2_shamanspots_description_CH: "평원의 샤먼들에게서 영감을 받은 이 솥 컬렉션은 엘더웍에서의 요리를 향상시킨다."

piece_elderwok_ext3_sharpenedcarapacerazors_CH: "날카로운 갑각 칼날"
