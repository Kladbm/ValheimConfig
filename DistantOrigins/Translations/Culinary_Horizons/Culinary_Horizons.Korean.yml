item_spice_processed_elite_vindfros_CH: "빈드프로스"
item_spice_processed_elite_vindfros_description_CH: "요리를 할 수 있었다면, 모데르 자신도 이것을 식사에 사용했을 것이다."

item_spice_processed_elite_solakras_CH: "솔라크라스"
item_spice_processed_elite_solakras_description_CH: "완전히 가공되고 준비된 이 향신료는 최고의 연회에 꼭 필요한 존재가 될 것이다."

item_spice_processed_elite_mistilteig_CH: "미스틸테이그"
item_spice_processed_elite_mistilteig_description_CH: "이그드라실의 수액이 이 향신료에 스며들어, 더해진 모든 음식을 축복한다."

item_spice_processed_elite_Alvmas_CH: "알브마스"
item_spice_processed_elite_Alvmas_description_CH: "고대의 요리 기법이 이 향신료에 깃들어, 더해진 모든 음식에 지속적인 감동을 남긴다."

