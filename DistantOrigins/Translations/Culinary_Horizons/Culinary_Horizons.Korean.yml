item_forgotten_sweetenedvegetablebowl_CH: "달콤한 채소 볼"
item_forgotten_sweetenedvegetablebowl_description_CH: "달콤한 육수에 삶은 이 채소들은 기억에 남을 별미가 될 것이다."

item_forgotten_swampystew_CH: "늪지 스튜"
item_forgotten_swampystew_description_CH: "늪지의 전통으로, 이 맛있는 스프는 다소... 기묘한 외관을 지니고 있다."

item_forgotten_fenringmeatboard_CH: "펜링의 고기 보드"
item_forgotten_fenringmeatboard_description_CH: "펜링에 걸맞은 플래터로, 다양하고 육즙 가득한 고기 부위들이 담겨 있다."

item_forgotten_highlandssoup_CH: "고원 양조 스프"
item_forgotten_highlandssoup_description_CH: "고향의 한 조각 같은 느낌을 주는 가볍고 상쾌한 스프."

item_forgotten_poacheddrakescales_CH: "포치드 드레이크 비늘"
item_forgotten_poacheddrakescales_description_CH: "만지면 차가운 이 비늘은 큰 로스트에서 볼 수 있는 돼지 껍데기 튀김과 비슷하다."

item_forgotten_uncooked_tarredplainspies_CH: "굽지 않은 타르 평원 파이"
item_forgotten_uncooked_tarredplainspies_description_CH: "타르에 절인 고기를 채운 굽지 않은 파이로, 제대로 익히려면 특별한 화로가 필요하다."

item_forgotten_cooked_tarredplainspies_CH: "구운 타르 평원 파이"
item_forgotten_cooked_tarredplainspies_description_CH: "풍미 가득한 구운 파이로, 먹은 바이킹이라면 누구나 배가 부를 것이다."

item_forgotten_charred_tarredplainspies_CH: "숯불 타르 평원 파이"
item_forgotten_charred_tarredplainspies_description_CH: "그을림이 이 플래터에 기분 좋은 바삭함을 더해주었다."

item_forgotten_uncooked_mixeddoughplatter_CH: "굽지 않은 모둠 반죽 플래터"
item_forgotten_uncooked_mixeddoughplatter_description_CH: "다양한 모양과 크기의 굽지 않은 반죽을 담은 플래터."

item_forgotten_cooked_mixeddoughplatter_CH: "구운 모둠 반죽 플래터"
item_forgotten_cooked_mixeddoughplatter_description_CH: "바삭한 것도, 부드러운 것도, 그 모든 것이 맛있는 다양한 구운 과자 모음."

item_forgotten_uncooked_jotunnsbounty_CH: "익히지 않은 요툰의 풍요"
item_forgotten_uncooked_jotunnsbounty_description_CH: "미스트랜드에서 모은 다양한 고기 모음으로, 조리할 준비가 되어 있다."

item_forgotten_cooked_jotunnsbounty_CH: "요툰의 풍요"
item_forgotten_cooked_jotunnsbounty_description_CH: "섬세한 고기와 부위를 풍성하게 담아낸 플래터로, 고대 요툰조차 먹고 나면 배가 부를 것이다."

item_forgotten_uncooked_seekersupreme_CH: "익히지 않은 시커 슈프림"
item_forgotten_uncooked_seekersupreme_description_CH: "부드러운 시커 고기 꼬치 모음으로, 조리할 준비가 되어 있다."

item_forgotten_cooked_seekersupreme_CH: "시커 슈프림"
item_forgotten_cooked_seekersupreme_description_CH: "부드럽고, 육즙 가득하며, 영양 만점. 플래터 전체를 한 번에 다 먹어치우는 것도 놀랄 일이 아니다."

item_forgotten_gjallsfireybroth_CH: "갈의 불꽃 육수"
item_forgotten_gjallsfireybroth_description_CH: "이제 갈이 안개 속에서 울부짖는 이유를 알 것 같다."

#_Banquets_#

item_banquet_meadows_feast_CH: "최초의 대지 연회"
item_banquet_meadows_feast_description_CH: "초원은 제10 왕국의 모든 안락함이 깃든 곳이다. 이 플래터는 때로는 잠시 멈추고 삶을 즐기라는 것을 상기시켜준다."

item_banquet_blackforest_pinevegetables_CH: "소나무 훈제 채소"
item_banquet_blackforest_pinevegetables_description_CH: "소나무 통나무 위에서 훈제한 버섯과 당근의 소박한 모음. 먹으면 팔에 숲을 쓰러뜨릴 만한 에너지가 솟구치는 것을 느낄 것이다."

item_banquet_blackforest_sap_CH: "장로의 정기 주입 수액"
item_banquet_blackforest_sap_description_CH: "이 수액은 장로의 기억의 바다로 향하는 관문 역할을 하며, 한 모금마다 다른 이야기를 들려주고 동기 부여의 물결을 남긴다."

item_banquet_swamp_pork_CH: "육즙 흘러내리는 돼지고기 트리밍"
item_banquet_swamp_pork_description_CH: "소시지, 소시지, 소시지! 이 플래터를 가진 바이킹은 결코 굶주리지 않을 것이며 싸우지 않고 쓰러지는 일도 없을 것이다."

