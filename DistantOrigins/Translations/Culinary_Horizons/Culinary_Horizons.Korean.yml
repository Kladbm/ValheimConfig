#_Unprocessed_Elite_Spices_#

item_spice_unprocessed_elite_eldakras_CH: "생 엘다크라스"
item_spice_unprocessed_elite_eldakras_description_CH: "강렬한 초록빛 광채가 이 향신료를 감싸며, 수많은 풍미를 약속한다."

item_spice_unprocessed_elite_marshmas_CH: "생 마쉬마스"
item_spice_unprocessed_elite_marshmas_description_CH: "어둡고 이끼 낀 마쉬마스는 어떤 바이킹에게도 지속적인 인상을 남길 것이다."

item_spice_unprocessed_elite_vindfros_CH: "생 빈드프로스"
item_spice_unprocessed_elite_vindfros_description_CH: "요리를 할 수 있었다면, 모데르 자신도 이것을 식사에 사용했을 것이다."

item_spice_unprocessed_elite_solakras_CH: "생 솔라크라스"
item_spice_unprocessed_elite_solakras_description_CH: "날것 상태에서도 솔라크라스는 햇살처럼 밝고 어딘가 명랑한 성질을 지니고 있다."

item_spice_unprocessed_elite_mistilteig_CH: "생 미스틸테이그"
item_spice_unprocessed_elite_mistilteig_description_CH: "날것 상태에서도 이그드라실의 수액이 이 향신료에 스며들어 있다."

item_spice_unprocessed_elite_Alvmas_CH: "생 알브마스"
item_spice_unprocessed_elite_Alvmas_description_CH: "용암처럼 밀도가 높아, 이 생 향신료는 철저히 갈아야 한다."

