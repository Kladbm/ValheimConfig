#_Stations_#

piece_station_elderwok_CH: "Elderwok"
piece_station_description_elderwok_CH: "Forjado con una aleación duradera, el Elderwok puede idear recetas olvidadas."

piece_banquetbench_CH: "Banquete de Madera de Bronce"
piece_banquetbench_description_CH: "Donde un chef prepara grandes banquetes, equipado con las mejores herramientas y cubiertos del décimo reino."

piece_station_spicetable_CH: "Mesa de Especias"
piece_station_spicetable_description_CH: "Una mesa para crear varias especias comunes y élite con hierbas encontradas en todo el reino."

