#_Unprocessed_Common_Spices_#

item_spice_unprocessed_common_giantsseasoning_CH: "Condimento de Gigante Crudo"
item_spice_unprocessed_common_giantsseasoning_description_CH: "Una especia cruda que se cree fue usada por los Jotun, añadiendo un sabor herbáceo fresco a una comida."

item_spice_unprocessed_common_surtlingcinders_CH: "Cenizas de Surtling Crudas"
item_spice_unprocessed_common_surtlingcinders_description_CH: "Huesos polvorientos y cenizas pueden no sonar apetitosos en su forma cruda, pero cuando se muelen, proporcionan una textura terrosa."

item_spice_unprocessed_common_frostedpowder_CH: "Polvo Escarchado Crudo"
item_spice_unprocessed_common_frostedpowder_description_CH: "Aunque crudo, este polvo aún puede conservar cualquier cosa que toque."

item_spice_unprocessed_common_cracklingflakes_CH: "Hojuelas Crujientes Crudas"
item_spice_unprocessed_common_cracklingflakes_description_CH: "Crujientes y ácidas incluso en su forma cruda."

item_spice_unprocessed_common_shroudedseasonings_CH: "Condimento Embozado Crudo"
item_spice_unprocessed_common_shroudedseasonings_description_CH: "Una suave niebla envuelve este polvo crudo."

item_spice_unprocessed_common_sorrowfulcinders_CH: "Cenizas Afligidas Crudas"
item_spice_unprocessed_common_sorrowfulcinders_description_CH: "Chispas ardientes emergen de esta especia cruda."

#_Processed_Common_Spices_#

item_spice_processed_common_giantsseasoning_CH: "Condimento de Gigante"
item_spice_processed_common_giantsseasoning_description_CH: "Una especia que se cree fue usada por los Jotun, añadiendo un sabor herbáceo fresco a una comida."

item_spice_processed_common_surtlingcinders_CH: "Cenizas de Surtling"
item_spice_processed_common_surtlingcinders_description_CH: "Huesos polvorientos y cenizas ahora proporcionan una textura terrosa."

item_spice_processed_common_frostedpowder_CH: "Polvo Escarchado"
item_spice_processed_common_frostedpowder_description_CH: "Ahora procesado, este polvo es un excelente conservante."

item_spice_processed_common_cracklingflakes_CH: "Hojuelas Crujientes"
item_spice_processed_common_cracklingflakes_description_CH: "Cada bocado de cualquier comida con este condimento resultará en una explosión de sabor."

item_spice_processed_common_shroudedseasonings_CH: "Condimento Embozado"
item_spice_processed_common_shroudedseasonings_description_CH: "Esta especia da un sabor vagamente dulce y reconfortante a cualquier comida."

item_spice_processed_common_sorrowfulcinders_CH: "Cenizas Afligidas"
item_spice_processed_common_sorrowfulcinders_description_CH: "El calor de esta especia seguro dejará a cualquier vikingo rojo de la cara."

#_Unprocessed_Elite_Spices_#

item_spice_unprocessed_elite_eldakras_CH: "Eldakras Cruda"
item_spice_unprocessed_elite_eldakras_description_CH: "Un poderoso tono verde brilla alrededor de esta especia, prometiendo una plétora de sabores."

item_spice_unprocessed_elite_marshmas_CH: "Marshmas Cruda"
item_spice_unprocessed_elite_marshmas_description_CH: "Oscura y musgosa, Marshmas dejará una impresión duradera en cualquier vikingo."

item_spice_unprocessed_elite_vindfros_CH: "Vindfros Cruda"
item_spice_unprocessed_elite_vindfros_description_CH: "La propia Moder habría usado esto para sus comidas, si supiera cocinar."

item_spice_unprocessed_elite_solakras_CH: "Solakras Cruda"
item_spice_unprocessed_elite_solakras_description_CH: "Aunque cruda, Solakras tiene una naturaleza soleada y de alguna manera alegre."

item_spice_unprocessed_elite_mistilteig_CH: "Mistilteig Cruda"
item_spice_unprocessed_elite_mistilteig_description_CH: "Incluso cruda, la savia de Yggdrasil se filtra a través de esta especia."

item_spice_unprocessed_elite_Alvmas_CH: "Alvmas Cruda"
item_spice_unprocessed_elite_Alvmas_description_CH: "Tan densa como la lava, esta especia cruda necesitará ser molida completamente."

#_Processed_Elite_Spices_#

item_spice_processed_elite_eldakras_CH: "Eldakras"
item_spice_processed_elite_eldakras_description_CH: "Ahora procesada, esta especia tiene un aroma tentador que convertirá cualquier comida en una obra maestra."

item_spice_processed_elite_marshmas_CH: "Marshmas"
item_spice_processed_elite_marshmas_description_CH: "Oscura y musgosa, Marshmas dejará una impresión duradera en cualquier vikingo."

item_spice_processed_elite_vindfros_CH: "Vindfros"
item_spice_processed_elite_vindfros_description_CH: "La propia Moder habría usado esto para sus comidas, si supiera cocinar."

item_spice_processed_elite_solakras_CH: "Solakras"
item_spice_processed_elite_solakras_description_CH: "Completamente procesada y preparada, esta especia será necesaria para los mejores banquetes."

item_spice_processed_elite_mistilteig_CH: "Mistilteig"
item_spice_processed_elite_mistilteig_description_CH: "La savia de Yggdrasil se filtra a través de esta especia, bendiciendo cualquier comida a la que se añada."

item_spice_processed_elite_Alvmas_CH: "Alvmas"
item_spice_processed_elite_Alvmas_description_CH: "Las prácticas culinarias antiguas parecen haber imbuido esta especia, dejando un impacto duradero en cualquier comida a la que se añada."

