item_forgotten_uncooked_tarredplainspies_description_CH: "Empanadas sin cocer rellenas de carnes empapadas, que necesitan un hogar especial para cocinarse correctamente."

item_forgotten_cooked_tarredplainspies_CH: "Empanadas de las Llanos Horneadas"
item_forgotten_cooked_tarredplainspies_description_CH: "Empanadas horneadas rebosantes de sabor, cualquier vikingo tendrá la barriga llena después de comer esto."

item_forgotten_charred_tarredplainspies_CH: "Empanadas de las Llanos Carbonizadas"
item_forgotten_charred_tarredplainspies_description_CH: "El carbonizado ha dejado esta bandeja con una deliciosa textura crujiente."

item_forgotten_uncooked_mixeddoughplatter_CH: "Fuente de Masa Mixta sin Cocer"
item_forgotten_uncooked_mixeddoughplatter_description_CH: "La fuente de masas sin cocer en varias formas y tamaños."

item_forgotten_cooked_mixeddoughplatter_CH: "Fuente de Masa Mixta Horneada"
item_forgotten_cooked_mixeddoughplatter_description_CH: "Una amplia variedad de pasteles, algunos crujientes, otros suaves, todos ellos - Deliciosos."

item_forgotten_uncooked_jotunnsbounty_CH: "Botín del Jotun sin Cocer"
item_forgotten_uncooked_jotunnsbounty_description_CH: "Una amplia variedad de carnes recolectadas de las Tierras Brumosas, listas para cocinar."

item_forgotten_cooked_jotunnsbounty_CH: "Botín del Jotun"
item_forgotten_cooked_jotunnsbounty_description_CH: "Una fuente abundante de carnes y cortes delicados, incluso el antiguo Jotun se sentiría lleno después de comer esto."

item_forgotten_uncooked_seekersupreme_CH: "Supremo de Buscador sin Cocer"
item_forgotten_uncooked_seekersupreme_description_CH: "Una variedad de tiernas brochetas de carne de buscador listas para cocinar."

item_forgotten_cooked_seekersupreme_CH: "Supremo de Buscador"
item_forgotten_cooked_seekersupreme_description_CH: "Tierno, jugoso y nutritivo, no es de extrañar que puedas comer toda la bandeja de una sola vez."

item_forgotten_gjallsfireybroth_CH: "Caldo Ardiente de Gjall"
item_forgotten_gjallsfireybroth_description_CH: "Ahora sabes por qué los Gjall braman a través de las brumas."

