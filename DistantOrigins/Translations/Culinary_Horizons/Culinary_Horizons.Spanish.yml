piece_spicetable_ext1_rackedvials_CH: "Viales en Estante"
piece_spicetable_ext1_rackedvials_description_CH: "Una serie de recipientes de vidrio para almacenar una variedad de especias para tu mesa de especias."

piece_spicetable_ext2_roastingbasin_CH: "Bandeja para Tostar"
piece_spicetable_ext2_roastingbasin_description_CH: "Con temperaturas abrasadoras, esta bandeja puede tostar casi cualquier especia lista para usar en la mesa de especias."

piece_spicetable_ext3_reinforcedsealbreaker_CH: "Rompesellos Reforzado"
piece_spicetable_ext3_reinforcedsealbreaker_description_CH: "Las gotas de energía del rompesellos transforman cualquier hierba expuesta a él."

piece_elderwok_ext1_obsidianequipment_CH: "Equipo de Cocina de Obsidiana"
piece_elderwok_ext1_obsidianequipment_description_CH: "Una serie de cucharones y cucharas colgantes para ayudar en la cocina en el Elderwok."

piece_elderwok_ext2_shamanspots_CH: "Ollas de Chamán"
piece_elderwok_ext2_shamanspots_description_CH: "Esta colección de ollas ha sido inspirada por los chamanes de las Llanuras para mejorar tu cocina en el Elderwok."

piece_elderwok_ext3_sharpenedcarapacerazors_CH: "Cuchillas de Caparazón Afiladas"
piece_elderwok_ext3_sharpenedcarapacerazors_description_CH: "El par de cuchillas más afilado, que cortará cualquier carne como mantequilla."

