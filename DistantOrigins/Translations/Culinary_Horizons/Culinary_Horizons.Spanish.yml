item_enhanced_soakedloxmeat_CH: "Carne de Lox Empapada"
item_enhanced_soakedloxmeat_description_CH: "Carne de lox sumergida en alquitrán, lista para asar lentamente sobre un hogar."

item_enhanced_roastedloxmeat_CH: "Carne de Lox Asada"
item_enhanced_roastedloxmeat_description_CH: "Un gran trozo de carne de lox asada lentamente."

item_enhanced_charredloxmeat_CH: "Carne de Lox Carbonizada"
item_enhanced_charredloxmeat_description_CH: "Una pierna carbonizada de carne de lox, sorprendentemente tierna al comer."

item_enhanced_seededbreaddough_CH: "Masa de Pan con Semillas"
item_enhanced_seededbreaddough_description_CH: "Una hogaza de masa cuidadosamente salpicada con condimento."

item_enhanced_seededbread_CH: "Pan con Semillas"
item_enhanced_seededbread_description_CH: "Una hogaza suave con una corteza crujiente."

item_enhanced_fishskewer_CH: "Brocheta de Pescado Sazonada"
item_enhanced_fishskewer_description_CH: "Trozos de pescado rebozados combinados con moras de los nublados y setas."

item_enhanced_infusedjotunnpuffs_CH: "Soplo de Jotun Infundido"
item_enhanced_infusedjotunnpuffs_description_CH: "Brillantes y relucientes, estos Soplos de Jotun tienen un crujido delicioso."

item_enhanced_infusedmagecaps_CH: "Caps de Mago Infundidas"
item_enhanced_infusedmagecaps_description_CH: "Estas Caps de Mago están repletas de energía."

item_enhanced_infusedcookedharemeat_CH: "Carne de Liebre Cocida Infundida"
item_enhanced_infusedcookedharemeat_description_CH: "Un corte magro y tierno de carne de liebre, envuelto en un tenue tono púrpura."

item_enhanced_infusedcookedseekermeat_CH: "Carne de Buscador Cocida Infundida"
item_enhanced_infusedcookedseekermeat_description_CH: "La textura suave pero crujiente de esta carne de buscador se derrite en la boca."

item_enhanced_scorchedcookedvolturemeat_CH: "Carne de Volture Cocida y Chamuscada"
item_enhanced_scorchedcookedvolturemeat_description_CH: "Chamuscado y brillante, este trozo carnoso es apto para cualquier vikingo."

item_enhanced_scorchedcookedasksvintail_CH: "Cola de Asksvin Cocida y Chamuscada"
item_enhanced_scorchedcookedasksvintail_description_CH: "Una cola magra de asksvin con un bocado sorprendentemente crujiente."

item_enhanced_scorchedsmokepuff_CH: "Soplo de Humo Chamuscado"
item_enhanced_scorchedsmokepuff_description_CH: "Un soplo de humo chamuscado con un débil resplandor tibio."

item_enhanced_scorchedmorgenheart_CH: "Corazón de Morgen Chamuscado"
item_enhanced_scorchedmorgenheart_description_CH: "Ahora chamuscado, esta será una comida sustanciosa, pero no esperes que te llene de energía."

#_Forgotten_Recipes_#

item_forgotten_marbledmixedmeats_CH: "Carnes Mixtas Veteada"
item_forgotten_marbledmixedmeats_description_CH: "Esta generosa bandeja de carnes de alta calidad servirá como una comida sustanciosa."

item_forgotten_honeycoatedvegetables_CH: "Verduras Bañadas en Miel"
item_forgotten_honeycoatedvegetables_description_CH: "Una variedad de verduras glaseadas con miel, para cualquier vikingo con un largo día por delante."

item_forgotten_berrybraisedboar_CH: "Jabalí Estofado con Bayas"
item_forgotten_berrybraisedboar_description_CH: "Aunque a los vikingos les cueste decir su nombre, esta bandeja equilibrada es la favorita de muchos."

item_forgotten_agedcuredmeats_CH: "Carnes Curadas y Añejadas"
item_forgotten_agedcuredmeats_description_CH: "Carnes finamente añejadas cuidadosamente dispuestas para los amantes de la carne."

item_forgotten_sweetenedvegetablebowl_CH: "Tazón de Verduras Endulzadas"
item_forgotten_sweetenedvegetablebowl_description_CH: "Hervidas en un caldo dulce, estas verduras serán un manjar para recordar."

item_forgotten_swampystew_CH: "Estofado Pantanoso"
item_forgotten_swampystew_description_CH: "Como tradición en los pantanos, esta sabrosa sopa tiene un aspecto un poco... extraño."

item_forgotten_fenringmeatboard_CH: "Tabla de Carnes de Fenring"
item_forgotten_fenringmeatboard_description_CH: "Una bandeja digna de un Fenring, con una amplia variedad de jugosos cortes."

item_forgotten_highlandssoup_CH: "Sopa de las Tierras Altas"
item_forgotten_highlandssoup_description_CH: "Una sopa ligera y refrescante que se siente como un pequeño pedazo de hogar."

item_forgotten_poacheddrakescales_CH: "Escamas de Drago Escalfadas"
item_forgotten_poacheddrakescales_description_CH: "Frescas al tacto, estas escamas son similares al chicharrón de cerdo en un gran asado."

