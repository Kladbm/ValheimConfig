#_Unprocessed_Common_Spices_#

item_spice_unprocessed_common_giantsseasoning_CH: "Assaisonnement des Géants Brut"
item_spice_unprocessed_common_giantsseasoning_description_CH: "Une épice brute dont on pense qu'elle était utilisée par les Jotunn, apportant une saveur herbacée et fraîche à un repas."

item_spice_unprocessed_common_surtlingcinders_CH: "Cendres de Surtling Brutes"
item_spice_unprocessed_common_surtlingcinders_description_CH: "Des os poussiéreux et des cendres peuvent ne pas sembler appétissants sous leur forme brute, mais une fois moulus, ils apportent une texture terreuse."

item_spice_unprocessed_common_frostedpowder_CH: "Poudre Givrée Brute"
item_spice_unprocessed_common_frostedpowder_description_CH: "Même brute, cette poudre peut encore conserver tout ce qu'elle touche."

item_spice_unprocessed_common_cracklingflakes_CH: "Flocons Crépitants Bruts"
item_spice_unprocessed_common_cracklingflakes_description_CH: "Croquants et acidulés, même sous leur forme brute."

item_spice_unprocessed_common_shroudedseasonings_CH: "Assaisonnements Voilés Bruts"
item_spice_unprocessed_common_shroudedseasonings_description_CH: "Un léger brouillard se dépose sur cette poudre brute."

item_spice_unprocessed_common_sorrowfulcinders_CH: "Cendres du Chagrin Brutes"
item_spice_unprocessed_common_sorrowfulcinders_description_CH: "Des braises ardentes crépitent depuis cette épice brute."

#_Processed_Common_Spices_#

item_spice_processed_common_giantsseasoning_CH: "Assaisonnement des Géants"
item_spice_processed_common_giantsseasoning_description_CH: "Une épice dont on pense qu'elle était utilisée par les Jotunn, apportant une saveur herbacée et fraîche à un repas."

item_spice_processed_common_surtlingcinders_CH: "Cendres de Surtling"
item_spice_processed_common_surtlingcinders_description_CH: "Des os poussiéreux et des cendres peuvent ne pas sembler appétissants sous leur forme brute, mais désormais ils apportent une texture terreuse."

item_spice_processed_common_frostedpowder_CH: "Poudre Givrée"
item_spice_processed_common_frostedpowder_description_CH: "Maintenant traitée, cette poudre constitue un excellent agent conservateur."

item_spice_processed_common_cracklingflakes_CH: "Flocons Crépitants"
item_spice_processed_common_cracklingflakes_description_CH: "Chaque bouchée de tout aliment assaisonné de cette épice provoquera une explosion de saveurs."

item_spice_processed_common_shroudedseasonings_CH: "Assaisonnement Voilé"
item_spice_processed_common_shroudedseasonings_description_CH: "Cette épice apporte une saveur vaguement douce et apaisante à n'importe quel repas."

item_spice_processed_common_sorrowfulcinders_CH: "Cendres du Chagrin"
item_spice_processed_common_sorrowfulcinders_description_CH: "La chaleur de cette épice ne manquera pas de faire rougir n'importe quel viking."

#_Unprocessed_Elite_Spices_#

item_spice_unprocessed_elite_eldakras_CH: "Eldakras Brut"
item_spice_unprocessed_elite_eldakras_description_CH: "Une puissante lueur verte entoure cette épice, promettant une pléthore de saveurs."

item_spice_unprocessed_elite_marshmas_CH: "Marshmas Brut"
item_spice_unprocessed_elite_marshmas_description_CH: "Sombre et moussu, le Marshmas laissera une impression durable sur tout viking."

item_spice_unprocessed_elite_vindfros_CH: "Vindfros Brut"
item_spice_unprocessed_elite_vindfros_description_CH: "Moder elle-même aurait utilisé ceci pour ses repas, si elle avait su cuisiner."

item_spice_unprocessed_elite_solakras_CH: "Solakras Brut"
item_spice_unprocessed_elite_solakras_description_CH: "Même brut, le Solakras possède une nature ensoleillée et étrangement joyeuse."

item_spice_unprocessed_elite_mistilteig_CH: "Mistilteig Brut"
item_spice_unprocessed_elite_mistilteig_description_CH: "Même brute, la sève d'Yggdrasil transparaît à travers cette épice."

item_spice_unprocessed_elite_Alvmas_CH: "Alvmas Brut"
item_spice_unprocessed_elite_Alvmas_description_CH: "Aussi dense que de la lave, cette épice brute devra être soigneusement moulue."

#_Processed_Elite_Spices_#

item_spice_processed_elite_eldakras_CH: "Eldakras"
item_spice_processed_elite_eldakras_description_CH: "Désormais traitée, cette épice dégage un arôme envoûtant qui transformera n'importe quel repas en chef-d'œuvre."

item_spice_processed_elite_marshmas_CH: "Marshmas"
item_spice_processed_elite_marshmas_description_CH: "Sombre et moussu, le Marshmas laissera une impression durable sur tout viking."

item_spice_processed_elite_vindfros_CH: "Vindfros"
item_spice_processed_elite_vindfros_description_CH: "Moder elle-même aurait utilisé ceci pour ses repas, si elle avait su cuisiner."

item_spice_processed_elite_solakras_CH: "Solakras"
item_spice_processed_elite_solakras_description_CH: "Pleinement traité et préparé, cette épice sera indispensable pour les plus grands banquets."

item_spice_processed_elite_mistilteig_CH: "Mistilteig"
item_spice_processed_elite_mistilteig_description_CH: "La sève d'Yggdrasil imprègne cette épice, bénissant tout repas auquel elle est ajoutée."

item_spice_processed_elite_Alvmas_CH: "Alvmas"
item_spice_processed_elite_Alvmas_description_CH: "D'anciennes pratiques culinaires semblent avoir imprégné cette épice, laissant un impact durable sur tout repas auquel elle est ajoutée."

#_Enhanced_Foods_#

item_enhanced_boar_meat_CH: "Viande de Sanglier Cuite et Assaisonnée"
item_enhanced_boar_meat_description_CH: "Un morceau de sanglier fraîchement cuit et assaisonné."

item_enhanced_deer_meat_CH: "Viande de Cerf Cuite et Assaisonnée"
item_enhanced_deer_meat_description_CH: "Des côtes de cerf fraîchement cuites et assaisonnées."

item_enhanced_mushroom_CH: "Champignon Assaisonné"
item_enhanced_mushroom_description_CH: "Un champignon assaisonné constitue un encas nourrissant, mais serait meilleur comme ingrédient."

item_enhanced_carrot_CH: "Carotte Assaisonnée"
item_enhanced_carrot_description_CH: "Légèrement assaisonnée, cette carotte apportera tendrement sa touche à n'importe quel repas."

item_enhanced_sausages_CH: "Saucisses Assaisonnées"
item_enhanced_sausages_description_CH: "Fumées et savoureuses, ces saucisses sont adorées de tous les vikings."

item_enhanced_muckshake_CH: "Boue Pétillante"
item_enhanced_muckshake_description_CH: "Les bulles et les pétillements rendent ce breuvage un peu plus supportable."

item_enhanced_turnip_CH: "Navet Assaisonné"
item_enhanced_turnip_description_CH: "Toujours pas comestible seul, ce navet constituera un bel ajout à n'importe quel plat."

item_enhanced_wolfmeat_CH: "Viande de Loup Cuite et Assaisonnée"
item_enhanced_wolfmeat_description_CH: "La saveur de cette viande pourrait presque justifier la chasse dans les Montagnes."

item_enhanced_onion_CH: "Oignon Assaisonné"
item_enhanced_onion_description_CH: "Cet oignon apporte un croquant rafraîchissant au régime d'un viking."

item_enhanced_vegetableskewer_CH: "Brochette de Légumes Assaisonnée"
item_enhanced_vegetableskewer_description_CH: "Des légumes fraîchement cueillis enfilés sur un petit bâton, saupoudrés d'assaisonnement."

item_enhanced_eyescream_CH: "Eyescream Saupoudré"
item_enhanced_eyescream_description_CH: "Maintenant avec deux fois plus de chances de vous donner un mal de tête glacé !"

item_enhanced_soakedloxmeat_CH: "Viande de Lox Marinée"
item_enhanced_soakedloxmeat_description_CH: "Viande de lox trempée dans du goudron, prête à être rôtie lentement sur un foyer."

item_enhanced_roastedloxmeat_CH: "Viande de Lox Rôtie"
item_enhanced_roastedloxmeat_description_CH: "Un généreux morceau de viande de lox rôtie lentement."

item_enhanced_charredloxmeat_CH: "Viande de Lox Carbonisée"
item_enhanced_charredloxmeat_description_CH: "Une cuisse de lox carbonisée, étonnamment tendre à manger."

item_enhanced_seededbreaddough_CH: "Pâte à Pain aux Graines"
item_enhanced_seededbreaddough_description_CH: "Un pain soigneusement parsemé d'assaisonnement."

item_enhanced_seededbread_CH: "Pain aux Graines"
item_enhanced_seededbread_description_CH: "Un pain moelleux avec une croûte croustillante."

item_enhanced_fishskewer_CH: "Brochette de Poisson Assaisonnée"
item_enhanced_fishskewer_description_CH: "Tranches de poisson panées accompagnées de mûres de ronces et de champignons."

item_enhanced_infusedjotunnpuffs_CH: "Soufflés de Jotunn Infusés"
item_enhanced_infusedjotunnpuffs_description_CH: "Brillants et lumineux, ces Soufflés de Jotunn ont un délicieux croquant."

item_enhanced_infusedmagecaps_CH: "Chapignons de Mage Infusés"
item_enhanced_infusedmagecaps_description_CH: "Ces Chapignons de Mage débordent d'énergie."

item_enhanced_infusedcookedharemeat_CH: "Viande de Lièvre Cuite Infusée"
item_enhanced_infusedcookedharemeat_description_CH: "Une coupe de viande de lièvre maigre et tendre, enveloppée d'une légère teinte violette."

item_enhanced_infusedcookedseekermeat_CH: "Viande de Chercheur Cuite Infusée"
item_enhanced_infusedcookedseekermeat_description_CH: "La texture moelleuse et pourtant croustillante de cette viande de chercheur fond littéralement en bouche."

item_enhanced_scorchedcookedvolturemeat_CH: "Viande de Vautour Cuite et Brûlée"
item_enhanced_scorchedcookedvolturemeat_description_CH: "Brûlée et luisante, ce généreux morceau de viande convient à n'importe quel viking."

item_enhanced_scorchedcookedasksvintail_CH: "Queue d'Asksvin Cuite et Brûlée"
item_enhanced_scorchedcookedasksvintail_description_CH: "Une queue maigre d'asksvin qui offre une bouchée étonnamment croquante."

item_enhanced_scorchedsmokepuff_CH: "Nuage de Fumée Brûlé"
item_enhanced_scorchedsmokepuff_description_CH: "Un nuage de fumée brûlé avec une lueur faiblement chaude."

item_enhanced_scorchedmorgenheart_CH: "Cœur de Morgen Brûlé"
item_enhanced_scorchedmorgenheart_description_CH: "Désormais brûlé, ce sera un repas copieux, mais ne vous attendez pas à ce qu'il vous remplisse d'énergie."

#_Forgotten_Recipes_#

item_forgotten_marbledmixedmeats_CH: "Viandes Mélangées Marbrées"
item_forgotten_marbledmixedmeats_description_CH: "Ce généreux plateau de viandes de haute qualité constituera un repas copieux."

item_forgotten_honeycoatedvegetables_CH: "Légumes Enrobés de Miel"
item_forgotten_honeycoatedvegetables_description_CH: "Un assortiment de légumes glacés au miel, pour tout viking ayant une longue journée devant lui."

item_forgotten_berrybraisedboar_CH: "Sanglier Braisé aux Baies"
item_forgotten_berrybraisedboar_description_CH: "Même si les Vikings peinent à prononcer son nom, ce plat équilibré est un favori pour beaucoup."

item_forgotten_agedcuredmeats_CH: "Viandes Curées Affinées"
item_forgotten_agedcuredmeats_description_CH: "Des viandes soigneusement affinées et disposées pour les carnivores du monde entier."

item_forgotten_sweetenedvegetablebowl_CH: "Bol de Légumes Sucrés"
item_forgotten_sweetenedvegetablebowl_description_CH: "Mijotés dans un bouillon sucré, ces légumes seront un régal mémorable."

item_forgotten_swampystew_CH: "Ragoût des Marais"
item_forgotten_swampystew_description_CH: "Tradition des marécages, cette savoureuse soupe a l'air un peu... étrange."

item_forgotten_fenringmeatboard_CH: "Planche de Viandes du Fenring"
item_forgotten_fenringmeatboard_description_CH: "Un plateau digne d'un Fenring, avec un large assortiment de coupes juteuses."

item_forgotten_highlandssoup_CH: "Soupe Brassée des Highlands"
item_forgotten_highlandssoup_description_CH: "Une soupe légère et rafraîchissante qui ressemble à un petit bout de chez soi."

item_forgotten_poacheddrakescales_CH: "Écailles de Drake Pochées"
item_forgotten_poacheddrakescales_description_CH: "Froides au toucher, ces écailles ressemblent aux couennes de porc que l'on trouve lors d'un grand rôti."

item_forgotten_uncooked_tarredplainspies_CH: "Tartes des Plaines Goudronnées Non Cuites"
item_forgotten_uncooked_tarredplainspies_description_CH: "Des tartes non cuites garnies de viandes marinées, nécessitant un foyer spécial pour être correctement cuites."

item_forgotten_cooked_tarredplainspies_CH: "Tartes des Plaines Goudronnées Cuites"
item_forgotten_cooked_tarredplainspies_description_CH: "Des tartes cuites débordantes de saveurs, n'importe quel viking aura le ventre plein après les avoir mangées."

item_forgotten_charred_tarredplainspies_CH: "Tartes des Plaines Goudronnées Carbonisées"
item_forgotten_charred_tarredplainspies_description_CH: "La carbonisation a laissé ce plat avec un délicieux croustillant."

item_forgotten_uncooked_mixeddoughplatter_CH: "Plateau de Pâtes Mélangées Non Cuit"
item_forgotten_uncooked_mixeddoughplatter_description_CH: "Un plateau de pâtes non cuites en différentes formes et tailles."

item_forgotten_cooked_mixeddoughplatter_CH: "Plateau de Pâtes Mélangées Cuit"
item_forgotten_cooked_mixeddoughplatter_description_CH: "Un large assortiment de pâtisseries, certaines croquantes, certaines moelleuses, toutes délicieuses."

item_forgotten_uncooked_jotunnsbounty_CH: "Abondance des Jotunn Non Cuite"
item_forgotten_uncooked_jotunnsbounty_description_CH: "Un large assortiment de viandes récoltées dans les Terres du Brouillard, prêtes à être cuisinées."

item_forgotten_cooked_jotunnsbounty_CH: "Abondance des Jotunn"
item_forgotten_cooked_jotunnsbounty_description_CH: "Un généreux plateau de viandes et de coupes délicates, même les anciens Jotunn se retrouveraient rassasiés après l'avoir mangé."

item_forgotten_uncooked_seekersupreme_CH: "Suprême du Chercheur Non Cuit"
item_forgotten_uncooked_seekersupreme_description_CH: "Un assortiment de brochettes de viande de chercheur tendres, prêtes à être cuites."

item_forgotten_cooked_seekersupreme_CH: "Suprême du Chercheur"
item_forgotten_cooked_seekersupreme_description_CH: "Tendre, juteux et nutritif, il n'est pas étonnant que l'on puisse dévorer tout le plateau en une seule fois."

item_forgotten_gjallsfireybroth_CH: "Bouillon Ardent du Gjall"
item_forgotten_gjallsfireybroth_description_CH: "Vous comprenez maintenant pourquoi les Gjalls mugissent à travers les brumes."

#_Banquets_#

