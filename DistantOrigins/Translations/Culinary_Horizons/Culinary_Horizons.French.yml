#_Stations_#

piece_station_elderwok_CH: "Elderwok"
piece_station_description_elderwok_CH: "Forgé dans un alliage durable, l'Elderwok permet de retrouver des recettes oubliées."

piece_banquetbench_CH: "Banc de Banquet en Bois de Bronze"
piece_banquetbench_description_CH: "Là où un chef prépare de grands banquets, équipé des meilleurs outils et couverts du 10ème royaume."

piece_station_spicetable_CH: "Table aux Épices"
piece_station_spicetable_description_CH: "Une table pour créer diverses épices communes et d'élite à partir d'herbes trouvées à travers le royaume."

#_Station_Extensions_#

piece_spicetable_ext1_rackedvials_CH: "Fioles en Rack"
piece_spicetable_ext1_rackedvials_description_CH: "Une série de contenants en verre pour stocker une variété d'épices pour votre table aux épices."

piece_spicetable_ext2_roastingbasin_CH: "Plateau de Torréfaction"
piece_spicetable_ext2_roastingbasin_description_CH: "Grâce à ses températures brûlantes, ce plateau peut torréfier presque n'importe quelle épice, prête à être utilisée à la table aux épices."

piece_spicetable_ext3_reinforcedsealbreaker_CH: "Brise-Sceau Renforcé"
piece_spicetable_ext3_reinforcedsealbreaker_description_CH: "Les orbes d'énergie dégoulinant du brise-sceau transforment toute herbe qui y est exposée."

piece_elderwok_ext1_obsidianequipment_CH: "Équipement de Cuisine en Obsidienne"
piece_elderwok_ext1_obsidianequipment_description_CH: "Une série de louches et de cuillères suspendues pour faciliter la cuisine à l'Elderwok."

piece_elderwok_ext2_shamanspots_CH: "Pots des Chamans"
piece_elderwok_ext2_shamanspots_description_CH: "Cette collection de pots s'est inspirée des chamans des Plaines pour sublimer votre cuisine à l'Elderwok."

piece_elderwok_ext3_sharpenedcarapacerazors_CH: "Rasoirs de Carapace Aiguisés"
piece_elderwok_ext3_sharpenedcarapacerazors_description_CH: "La paire de lames la plus tranchante, qui découpera n'importe quelle viande comme du beurre."

