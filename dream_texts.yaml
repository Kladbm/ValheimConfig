- text: "Ти блукаєш туманним лісом, де серед дерев мерехтять примарні тіні."
  chance: 0.45
  forbiddenKeys: defeated_eikthyr
- text: "Десь неподалік чути звук рогів, і ти бачиш силует величезного оленя."
  chance: 0.5
  forbiddenKeys: defeated_eikthyr
- text: "У нічній темряві над тобою пролітає ворона, її очі блищать у місячному сяйві."
  chance: 0.6
  forbiddenKeys: defeated_eikthyr
- text: "Ти відчуваєш, як холод від землі пробирається до кісток, і чуєш крики древніх душ."
  chance: 0.55
  forbiddenKeys: defeated_eikthyr
- text: "Ти знаходиш уламки стародавнього кола стоячих каменів."
  chance: 0.4
  forbiddenKeys: defeated_eikthyr
- text: "На горизонті виринає силует кам'яної брами, за якою ховаються невідомі сили."
  chance: 0.5
  forbiddenKeys: defeated_eikthyr
- text: "Ти бачиш у вогні образ старого воїна з однією рукою, що мовчки дивиться на тебе."
  chance: 0.5
  forbiddenKeys: defeated_eikthyr
- text: "У вісні до тебе приходить велетенський олень з рогами, сплетеними блискавками."
  chance: 0.6
  forbiddenKeys: defeated_eikthyr
- text: "Ти торкаєшся древнього руна, і відчуваєш, як слова Одіна шепочуть у твоїй голові."
  chance: 0.4
  forbiddenKeys: defeated_eikthyr
- text: "На мить здається, що ти бачиш райдужний міст Біфрест, але він розчиняється у хмарах."
  chance: 0.55
  forbiddenKeys: defeated_eikthyr
- text: "Вітер приносить запах диму та смоли, як у часи древніх битв."
  chance: 0.5
  forbiddenKeys: defeated_eikthyr
- text: "Ти чуєш дзвін коваля, який кує зброю для богів."
  chance: 0.45
  forbiddenKeys: defeated_eikthyr
- text: "У ночі тобі сниться берег із уламками розбитого плоту."
  chance: 0.6
  forbiddenKeys: defeated_eikthyr
- text: "В лісі щось невидиме спостерігає за тобою крізь густий туман."
  chance: 0.4
  forbiddenKeys: defeated_eikthyr
- text: "Десь високо на горі видніється кам'яна статуя воїна із сокирою."
  chance: 0.6
  forbiddenKeys: defeated_eikthyr
- text: "Ворон Хугін прилітає до тебе у сні, мовчки сідає на плече й щось шепоче про майбутнє."
  chance: 0.5
  forbiddenKeys: defeated_eikthyr
- text: "Ти проходиш повз обгорілі дерева, і на корі бачиш руни про стародавню владу."
  chance: 0.55
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "У сні лунає глухий стукіт — мов кам'яні ворота відчиняються у глибині лісу."
  chance: 0.45
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "Ти торкаєшся осколка древнього трону, і відчуваєш присутність давнього царя."
  chance: 0.5
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "Між деревами тобі привиділась велетенська фігура з корінням замість рук."
  chance: 0.6
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "Ти стоїш на порозі покинутого храму, де відлунюють кроки Древнього."
  chance: 0.45
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "У глибокій ночі ти бачиш, як корені просочуються крізь землю і тягнуться до неба."
  chance: 0.5
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "Ти чуєш, як земля стогне під вагою тисячоліть, а вітром долинають голоси давніх."
  chance: 0.55
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "Ворон приносить тобі шматок старого кореня, обплетений мохом."
  chance: 0.45
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "В глибинах лісу ти знаходиш стародавню чашу, що світиться зеленим сяйвом."
  chance: 0.5
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "Ти бачиш, як у корі дерев проступають обличчя, що дивляться на тебе з мудрістю і тугою."
  chance: 0.6
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "Ти чуєш стогін дерев — вітри приносять попередження про пробудження чогось давнього."
  chance: 0.4
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "Перед тобою з'являється силует велетенської істоти, укритої листям і гілками."
  chance: 0.5
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "Вітер приносить слова, які ти не можеш зрозуміти, але відчуваєш у них силу і тягар років."
  chance: 0.55
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "Серед моху ти знаходиш старий амулет, який теплий на дотик."
  chance: 0.45
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "У сні ти йдеш стежкою, що веде до велетенського пня, від якого віє древньою магією."
  chance: 0.6
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "Ти бачиш у воді відображення дерев, які рухаються самі по собі."
  chance: 0.5
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "Ти стоїш у тіні старого дуба, і чуєш тихий шепіт листя — воно вітає тебе як переможця."
  chance: 0.55
  requiredKeys: defeated_eikthyr
  forbiddenKeys: defeated_gdking
- text: "Ти йдеш крізь туманне болото, і кожен крок тоне у зеленій твані."
  chance: 0.6
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Десь під водою щось гуде й булькотить — ти відчуваєш запах гнилі."
  chance: 0.45
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Ти бачиш скелети, що повстають із багнюки, і чуєш скрегіт кісток."
  chance: 0.5
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Над болотом витає зелений туман, а у воді відображаються черепи."
  chance: 0.55
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Ти відчуваєш тяжкість, ніби на тебе дивиться невидиме око із глибини болота."
  chance: 0.4
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Серед багнюки ти знаходиш уламки давньої зброї, вкриті пліснявою."
  chance: 0.6
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Ти чуєш ревіння, ніби весь світ задихається у тумані й смердючій воді."
  chance: 0.5
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "У воді пропливає щось величезне і слизьке, але ти бачиш лише хвилю."
  chance: 0.45
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Ворон Хугін приносить попередження: у болотах спить щось, що не повинно прокидатися."
  chance: 0.55
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Ти знаходиш величезну кістку, яку не може підняти жодна жива істота."
  chance: 0.6
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "У сні ти бредеш у мряці, і на плечі осідає щось важке й липке."
  chance: 0.4
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Відлуння стародавніх голосів кличе тебе у глибини трясовини."
  chance: 0.5
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Ти бачиш кам'яний вівтар, вкритий кістками та зеленими мохами."
  chance: 0.6
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Під ногами щось рухається — ти розумієш, що це кістяки забутих воїнів."
  chance: 0.5
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Ти стоїш на порозі древньої гробниці, з якої віє смородом і страхом."
  chance: 0.45
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Болото навколо тебе стискається, і здається, що саме повітря стало густішим."
  chance: 0.4
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Серед туманів ти бачиш обриси величезної фігури, складеної з бруду і кісток."
  chance: 0.55
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Древній дзвін під водою кличе душі до пробудження."
  chance: 0.5
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Ти чуєш бурління, а з болота здіймається хмара зловісного туману."
  chance: 0.6
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "В нічній тиші болота здаються безкрайніми, але ти знаєш — у їхніх надрах щось чекає."
  chance: 0.45
  requiredKeys: defeated_gdking
  forbiddenKeys: defeated_bonemass
- text: "Ти піднімаєшся крутими сніжними схилами, де вітер рве твій одяг на шматки."
  chance: 0.6
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Вночі тобі сниться крижаний палац серед хмар, звідки лунає ревіння."
  chance: 0.5
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "На вершині гори ти бачиш велетенський слід, залишений чиєюсь пазуристою лапою."
  chance: 0.45
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Серед снігів ти знаходиш замерзлу статую дракона, що пильно дивиться на тебе."
  chance: 0.4
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Ти відчуваєш крижану лють, що пронизує твоє серце на вершині засніженої скелі."
  chance: 0.55
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Сон приносить тобі видіння летючих тіней, які кружляють над засніженим лісом."
  chance: 0.5
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Ти чуєш голос, що шепоче: «Не кожен підкорює гори живим»."
  chance: 0.6
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Під льодом ти бачиш застиглі обличчя воїнів, які не змогли дістатися вершини."
  chance: 0.45
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Ти знаходиш уламки драккара, затиснутого у віковічному снігу."
  chance: 0.4
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "На засніженій стежці з'являється силует летючої істоти, що ковзає у хмарах."
  chance: 0.5
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Ти бачиш біле полум'я, що охоплює вершину — і чуєш ревіння дракона."
  chance: 0.6
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Серед снігової бурі з'являється кам'яний круг, де світиться стародавня руна."
  chance: 0.5
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Ти відчуваєш, як холод стискає легені, а вітер співає про велич Древньої."
  chance: 0.55
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Під зорями ти знаходиш сріблясту луску, що світиться у темряві."
  chance: 0.45
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Ти бачиш, як на вершині гори збирається хмара — з неї визирає гострий хвіст."
  chance: 0.4
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Сон приносить тобі спогад про давню битву з драконом у лютому снігу."
  chance: 0.6
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "У горах тебе переслідує лункий сміх, що розноситься від скелі до скелі."
  chance: 0.5
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Ти знаходиш вхід до печери, всередині якої блищить крижана корона."
  chance: 0.5
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Вітер приносить крижану пісню, у якій чутно згадку про ім'я Матері."
  chance: 0.55
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Ти бачиш у сні, як у сніжній бурі розкриваються гігантські крила."
  chance: 0.6
  requiredKeys: defeated_bonemass
  forbiddenKeys: defeated_moder
- text: "Ти блукаєш високою травою, де щось рухається на рівні твого зору."
  chance: 0.45
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "У нічному степу ти бачиш далекі вогнища, що палають серед кам’яних руїн."
  chance: 0.5
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Десь поряд хтось сміється — сміх жорстокий, хижий, ніби лунає з самого мороку."
  chance: 0.55
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Ти відчуваєш на собі погляд із темряви, і шкіра вкривається морозом."
  chance: 0.6
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Вогняний метеор розсікає небо, а земля під тобою здригається."
  chance: 0.5
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Ти знаходиш уламки золотого кубка, вкритого попелом і кров’ю."
  chance: 0.4
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Уві сні чутно тупіт малих ніг — це фулінги кличуть когось свого."
  chance: 0.6
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Серед трави ти бачиш кам’яну голову, розтріскану від старості."
  chance: 0.45
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "На небі танцюють зелені спалахи, а вітер приносить запах паленого м’яса."
  chance: 0.55
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Ти бачиш кістяні тотеми — їхні очі світяться у темряві."
  chance: 0.5
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Відчувається тиск сили, що виходить із глибини землі, мов сама вона готується вибухнути."
  chance: 0.6
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "У степу тобі сниться язикатий череп, що промовляє про полум'я і кінець."
  chance: 0.45
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Ти стоїш на полі, де з усіх боків лунають бойові крики фулінгів."
  chance: 0.5
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Вітром доноситься запах смаженого м’яса, а у повітрі відчувається небезпека."
  chance: 0.55
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Ти бачиш фіолетове сяйво, що з'являється серед трави, і відчуваєш страх."
  chance: 0.4
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Сон приносить відлуння стародавнього прокляття, що лине із розпечених каменів."
  chance: 0.5
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Над рівнинами ти бачиш клуби чорного диму, а вдалині – вежу, що горить."
  chance: 0.55
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Ти знаходиш уламки щита, обгорілого і майже знищеного."
  chance: 0.45
  requiredKeys: defeated_moder
  forbiddenKeys: defeated_goblinking
- text: "Ти блукаєш серед руїн у тумані, і всюди видно сліди важких комахиних лап — шукачі зовсім поруч."
  chance: 0.6
  requiredKeys: defeated_goblinking
  forbiddenKeys: defeated_queen
