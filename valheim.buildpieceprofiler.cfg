[Shadow Optimization]

## Experimental. Replaces groups of compatible batch shadows with fewer shadow-only meshes. Requires both this option and the shadow master switch.
# Setting type: Boolean
# Default value: false
EnableShadowCasterOptimization = false

## Master switch for all experimental shadow work. When off, no shadow grouping, mesh reading, caching, or cluster generation occurs.
# Setting type: Boolean
# Default value: false
EnableSystem = false

## Minimum number of compatible shadow-casting batches required before one replacement caster is considered.
# Setting type: Int32
# Default value: 4
MinimumVisibleBatchesPerCluster = 4

## Minimum estimated shadow draw calls that must be saved before a replacement caster is accepted.
# Setting type: Int32
# Default value: 3
MinimumShadowDrawsSaved = 3

## Maximum detail allowed in one generated shadow-only mesh.
# Setting type: Int32
# Default value: 150000
MaximumVerticesPerShadowMesh = 150000

## Rejects a shadow cluster when it adds too much geometry for each estimated shadow draw call saved.
# Setting type: Int32
# Default value: 25000
MaximumVerticesPerDrawSaved = 25000

## Largest allowed physical span of one shadow cluster. Smaller limits help Unity hide off-screen shadow casters more precisely.
# Setting type: Single
# Default value: 14
MaximumBoundsDiagonal = 14

## Experimental. Represents matching walls and roofs with simple box-like shadow geometry instead of their full mesh.
# Setting type: Boolean
# Default value: false
EnableSimplifiedStructuralCasters = false

## Comma-separated internal name fragments allowed to use simplified wall or roof shadow geometry.
# Setting type: String
# Default value: wall,roof
SimplifiedStructuralPieceNameTokens = wall,roof

[Static Component Sleeping]

## Master switch for this experimental system. When off, it performs no scanning, profiling, sleeping, scheduling, or wake-event work.
# Setting type: Boolean
# Default value: false
EnableSystem = false

## Lists build-piece scripts that run every frame or physics tick. This helps identify safe cosmetic scripts before adding them to the sleep list.
# Setting type: Boolean
# Default value: false
EnableComponentTypeProfiling = false

## Experimental. Pauses only approved cosmetic scripts on unchanged, non-interactive building pieces.
# Setting type: Boolean
# Default value: false
EnableStaticComponentSleeping = false

## Comma-separated exact script type names allowed to sleep. Built-in safety checks still reject known gameplay and interactive scripts.
# Setting type: String
# Default value: StaticRotation
CosmeticComponentTypeNames = StaticRotation

## Maximum build pieces inspected in one frame when the system starts. Lower values make discovery smoother but slower.
# Setting type: Int32
# Default value: 200
DiscoveryPiecesPerUpdate = 200

## Seconds an approved cosmetic script stays awake after its piece is placed, damaged, repaired, changed, or highlighted.
# Setting type: Single
# Default value: 2
WakeGraceSeconds = 2

## Maximum number of recurring build-piece script types listed in the profiler, ordered by how many enabled copies were found.
# Setting type: Int32
# Default value: 12
TopProfiledTypeCount = 12

[WearNTear]

## Stops structural-support and weather-wear calculations. Pieces still keep health, damage, repair, destruction, and saved network state.
# Setting type: Boolean
# Default value: false
EnableWearNTearOptimizations = false

## Support strength reported while support calculations are bypassed. The large default makes every affected structure fully supported.
# Setting type: Single
# Default value: 1000000
BypassedSupportValue = 1000000

