## Settings file was created by plugin Valheim Build Optimization v0.5.3
## Plugin GUID: valheim.buildpieceprofiler

[Collider Clustering]

## Master switch for this experimental system. When off, it performs no collider scanning, profiling, rebuilding, distance checks, or event work.
# Setting type: Boolean
# Default value: false
EnableSystem = false

## Counts simple static building boxes and estimates how many colliders could potentially be removed.
# Setting type: Boolean
# Default value: false
EnableColliderProfiling = false

## Experimental. Replaces distant rows of matching building boxes with fewer larger boxes. Requires wear-and-tear optimization.
# Setting type: Boolean
# Default value: false
EnableColliderClustering = false

## Size in meters of each local collider region. Smaller regions limit how far one cluster can spread.
# Setting type: Single
# Default value: 10
CellSize = 10

## Minimum number of matching box colliders required before merging is considered worthwhile.
# Setting type: Int32
# Default value: 12
MinimumBoxesPerCluster = 12

## Maximum original boxes represented by one generated merged box.
# Setting type: Int32
# Default value: 128
MaximumBoxesPerMergedCollider = 128

## Distance in meters where original piece colliders are always used for accurate building, selection, and combat.
# Setting type: Single
# Default value: 30
RestoreOriginalsWithinDistance = 30

## Distance in meters where merged colliders may replace originals. Keep this above the restore distance to prevent rapid switching.
# Setting type: Single
# Default value: 40
ActivateClustersBeyondDistance = 40

## Seconds between player-distance checks for collider regions. Longer intervals cost less CPU but switch less quickly.
# Setting type: Single
# Default value: 0.25
DistanceUpdateIntervalSeconds = 0.25

## Maximum changed collider regions rebuilt in one frame. Lower values reduce spikes during construction.
# Setting type: Int32
# Default value: 1
CellsRebuiltPerUpdate = 1

## Maximum loaded pieces inspected per frame when collider profiling starts.
# Setting type: Int32
# Default value: 200
DiscoveryPiecesPerUpdate = 200

## Comma-separated internal name fragments that must keep their own colliders for interaction, movement, or safety.
# Setting type: String
# Default value: door,gate,portal,teleport,crafting,workbench,forge,stonecutter,cauldron,fermenter,windmill,spinningwheel,smelter,blastfurnace,kiln,oven,chest,container,itemstand,armorstand,sign,cart,ship,ladder
ExcludedPieceNameTokens = door,gate,portal,teleport,crafting,workbench,forge,stonecutter,cauldron,fermenter,windmill,spinningwheel,smelter,blastfurnace,kiln,oven,chest,container,itemstand,armorstand,sign,cart,ship,ladder

[Fire]

## Optimizes known fire pieces when they are outside the camera view or safely hidden behind solid building geometry.
# Setting type: Boolean
# Default value: false
EnableFireOptimizations = false

## StaticLight keeps hidden areas lit with cheap shared lights. FullCull removes hidden fire lights and visual effects completely.
# Setting type: FireOptimizationMode
# Default value: StaticLight
# Acceptable values: StaticLight, FullCull
Mode = StaticLight

## Seconds between fire visibility checks. Lower values react faster; higher values reduce optimizer CPU work.
# Setting type: Single
# Default value: 0.5
UpdateIntervalSeconds = 0.5

## Seconds a fire must stay hidden before its expensive light and effects are optimized. This prevents rapid camera movement from causing visual popping.
# Setting type: Single
# Default value: 1.5
HiddenGraceSeconds = 1.5

## Seconds a fire must stay visible or unblocked before its original light and effects return. This prevents rapid on/off cycling.
# Setting type: Single
# Default value: 1
RestoreGraceSeconds = 1

[Fire Discovery]

## Comma-separated internal name fragments used to recognize safe fire pieces. Only matching Fireplace pieces can enter the optimizer.
# Setting type: String
# Default value: piece_firepit,fire_pit,firepit,piece_hearth,hearth,piece_bonfire,bonfire,brazier,piece_brazier,standing_brazier,groundtorch,walltorch,piece_groundtorch,piece_walltorch,sconce
KnownFirePieceNameTokens = piece_firepit,fire_pit,firepit,piece_hearth,hearth,piece_bonfire,bonfire,brazier,piece_brazier,standing_brazier,groundtorch,walltorch,piece_groundtorch,piece_walltorch,sconce

## Seconds between optional fallback scans for Fireplace components. This setting matters only when the periodic safety refresh is enabled.
# Setting type: Single
# Default value: 15
RefreshIntervalSeconds = 15

## Runs an occasional full Fireplace scan as a discovery fallback. Normal discovery is event-driven, so leave this off unless a modded fire is missed.
# Setting type: Boolean
# Default value: false
EnablePeriodicSafetyRefresh = false

## Comma-separated script-name fragments for known fire light animation scripts. Matching scripts pause while their fire is hidden.
# Setting type: String
# Default value: lightflicker,lightlod
LightUpdateComponentNameTokens = lightflicker,lightlod

[Fire Proxy Lights]

## Brightness of cheap replacement lights compared with the original hidden fire lights. 1.0 keeps the measured original brightness.
# Setting type: Single
# Default value: 1
IntensityMultiplier = 1

## Reach of cheap replacement lights compared with the original hidden fire lights. 1.0 keeps the measured original range.
# Setting type: Single
# Default value: 1
RangeMultiplier = 1

## Lets nearby hidden fires share one cheap replacement light, reducing active light count while keeping rooms illuminated.
# Setting type: Boolean
# Default value: true
UseClusteredLights = true

## Size in meters of the invisible cubes used to group hidden fires into shared replacement lights. Larger values share lights more aggressively.
# Setting type: Single
# Default value: 8
ClusterCellSize = 8

[Fire Visibility]

## Allows fires outside the camera's current field of view to use their hidden optimized state.
# Setting type: Boolean
# Default value: true
CullOutsideCamera = true

## Allows fires behind solid walls, floors, or roofs to use their hidden optimized state.
# Setting type: Boolean
# Default value: true
CullBehindGeometry = true

## Makes fire-piece colliders transparent to fire visibility checks so nearby braziers and torches do not incorrectly hide each other.
# Setting type: Boolean
# Default value: true
IgnoreOtherFirePieces = true

## Thickness of the visibility test from camera to fire. Zero uses a thin ray; a small radius is more stable around wall edges.
# Setting type: Single
# Default value: 0.05
OcclusionRayRadius = 0.05

## Seconds an occlusion result is reused before another physics check is needed. Longer caching costs less CPU but reacts more slowly to changes.
# Setting type: Single
# Default value: 1.5
OcclusionCacheSeconds = 1.5

## Maximum fresh wall-blocking physics checks allowed during one fire update. Lower values spread the work across more updates.
# Setting type: Int32
# Default value: 16
MaxOcclusionChecksPerUpdate = 16

## Draws green and red camera-to-fire lines for troubleshooting visibility checks. Intended only for testing.
# Setting type: Boolean
# Default value: false
DebugOcclusionRays = false

[Network Idle]

## Master switch for network diagnostics. When off, no network hooks, piece mapping, revision sampling, or statistic aggregation occurs.
# Setting type: Boolean
# Default value: false
EnableSystem = false

## Measures build-piece save-state writes, revision changes, ownership changes, remote calls, and global ZDO traffic. Diagnostic only.
# Setting type: Boolean
# Default value: false
EnableNetworkIdleProfiling = false

## Maximum loaded pieces connected to their save/network records in one frame during startup.
# Setting type: Int32
# Default value: 250
DiscoveryPiecesPerUpdate = 250

## Maximum tracked records checked for data or ownership changes in one frame.
# Setting type: Int32
# Default value: 256
RevisionSamplesPerUpdate = 256

## Seconds between published network summaries while the profiler window or logging is active.
# Setting type: Single
# Default value: 1
MetricsIntervalSeconds = 1

## Seconds a build-piece record remains classified as recently active after a successful write or revision change.
# Setting type: Single
# Default value: 10
ActiveWriterWindowSeconds = 10

## Maximum number of busiest build-piece records and remote-call names shown in the profiler.
# Setting type: Int32
# Default value: 10
TopWriterCount = 10

[Profiler]

## Allows the F7 profiler window and manual snapshots. Leave this off during normal play for zero profiler UI or snapshot overhead.
# Setting type: Boolean
# Default value: false
EnableProfiler = false

## Writes each completed profiler snapshot to the BepInEx log. Useful for comparisons, but repeated logging can create large files.
# Setting type: Boolean
# Default value: false
EnableConsoleLogging = false

## Opens the profiler window automatically after entering a world. The profiler must also be enabled.
# Setting type: Boolean
# Default value: false
ShowProfilerOnStart = false

## Refreshes profiler snapshots automatically while the window or logging is active. Leave this off in large worlds and use Poll now when needed.
# Setting type: Boolean
# Default value: false
EnableAutomaticPolling = false

## Seconds between automatic snapshots. Short intervals feel more live but make expensive scene scans happen more often.
# Setting type: Single
# Default value: 5
PollIntervalSeconds = 5

