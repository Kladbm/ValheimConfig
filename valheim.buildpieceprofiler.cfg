[Renderer Batching]

## Combines compatible static building meshes into fewer local renderers. Original colliders and gameplay components remain untouched.
# Setting type: Boolean
# Default value: false
EnableRendererBatching = false

## Size in meters of each local batching region. Smaller cells hide more precisely; larger cells can combine more renderers.
# Setting type: Single
# Default value: 10
CellSize = 10

## Smallest compatible group worth combining. Higher values avoid creating batches that save very little rendering work.
# Setting type: Int32
# Default value: 4
MinimumRenderersPerBatch = 4

## Maximum detail stored in one generated mesh. Groups above this limit are split into multiple combined renderers.
# Setting type: Int32
# Default value: 200000
MaximumVerticesPerMesh = 200000

## Maximum changed batching regions rebuilt in one frame. Lower values reduce construction spikes but take longer to finish updates.
# Setting type: Int32
# Default value: 1
CellsRebuiltPerUpdate = 1

## Maximum loaded pieces inspected per frame when batching starts. Lower values make startup smoother but slower.
# Setting type: Int32
# Default value: 250
DiscoveryPiecesPerUpdate = 250

## Wait time before rebuilding a changed region. This groups rapid building actions into fewer rebuilds.
# Setting type: Single
# Default value: 0.35
RebuildDelaySeconds = 0.35

## Comma-separated internal name fragments that must remain separate for interaction, animation, or safety.
# Setting type: String
# Default value: door,gate,portal,teleport,crafting,workbench,forge,stonecutter,cauldron,fermenter,windmill,spinningwheel,smelter,blastfurnace,kiln,oven,chest,container,itemstand,armorstand,sign,cart,ship
