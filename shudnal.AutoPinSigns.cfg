## Settings file was created by plugin Auto Pin Signs v1.2.0
## Plugin GUID: shudnal.AutoPinSigns

[General]

## Enable the mod
# Setting type: Boolean
# Default value: true
Enabled = true

## Configuration is locked and can be changed by server admins only.
# Setting type: Boolean
# Default value: true
Lock Configuration = true

## Enable logging. [Not Synced with Server]
# Setting type: Boolean
# Default value: false
Logging enabled = false

## If enabled - if nearby pin has no related sign that pin will be removed from map.
# Setting type: Boolean
# Default value: false
Remove nearby map pins without related signs = true

## Enable to create pins if the sign text contains any configured word instead of requiring an exact match.
# Setting type: Boolean
# Default value: true
Less strict string comparison = true

## Should sign text be stripped of HTML tags before string comparison. Disable this is you want HTML prefixes.
# Setting type: Boolean
# Default value: true
Strip HTML tags from text = true

[Matching Mode]

## If enabled, the mod checks whether sign text starts with a configured prefix (e.g. "Pin: "). Prefix text is NOT included in the pin name or visible sign text, but is preserved when editing the sign.
# Setting type: Boolean
# Default value: true
Use prefix matching = true

## If enabled, the mod compares the full sign text against configured word lists. The full sign text becomes the pin name.
# Setting type: Boolean
# Default value: true
Use string list matching = true

