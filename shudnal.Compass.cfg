[Compass]

## Orientation type. Camera direction or player eyes direction could be used as a center of a compass.
# Setting type: OrientationType
# Default value: Camera
# Acceptable values: Camera, Player
Orientation based on = Camera

## Defines whether compass is anchored to top or bottom side of the screen.
# Setting type: AnchorPositionType
# Default value: Top
# Acceptable values: Top, Bottom
Anchor position = Top

## Scale of whole compass component
# Setting type: Single
# Default value: 1
Scale = 0.9

## Offset from selected anchor position. X moves compass left/right. Y moves compass down from top, up from bottom.
# Setting type: Vector2
# Default value: {"x":0.0,"y":0.0}
