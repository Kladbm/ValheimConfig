## Show center marker
# Setting type: Boolean
# Default value: true
Show center = true

[General]

## Enable the mod.
# Setting type: Boolean
# Default value: true
Enabled = true

## Enable logging.
# Setting type: Boolean
# Default value: false
Logging enabled = false

[Pin style]

