# Setting type: Color
# Default value: 00000000
Color = 00000000

## Pins alpha. X for max alpha, Y for min alpha
# Setting type: Vector2
# Default value: {"x":1.0,"y":0.33000001311302187}
Alpha = {"x":1.0,"y":0.33000001311302187}

## Pins scale. X for max scale, Y for min scale
# Setting type: Vector2
# Default value: {"x":1.0,"y":0.33000001311302187}
Scale = {"x":1.0,"y":0.33000001311302187}

## Conditions for alpha and scale application
## X - Minimum distance to show pins
## Y - Distance where pins will start to become smaller. Size is at maximum. Alpha is at maximum.
## Z - Distance where pins will start to become more transparent. Size is at minimum. Alpha is at maximum.
## W - Maximum distance to show pins. Size is at minimum. Alpha is at minimum.
# Setting type: Vector4
# Default value: {"x":1.0,"y":20.0,"z":250.0,"w":550.0}
