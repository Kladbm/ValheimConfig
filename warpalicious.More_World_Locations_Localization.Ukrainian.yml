# Marble Jail 1
mwl_marblejail1_key: Ключ від мармурової темниці
mwl_marblejail1_key_desc: Іржавий залізний ключ, стертий від часу. Відчиняє камерний блок.
mwl_marblejail1_runestone: Похмурий кінець
mwl_marblejail1_runestone_text: "Вони забули мене тут. Роки перетворились на десятиліття. Істоти внизу стали звичними — їхній виск був моєю єдиною компанією. Я йду до них тепер. Вони чекали на мене. Більше не чекав ніхто."

# Marble Cliff Altar 1
mwl_marblecliffaltar1_runestone: Небезпечне надбання
mwl_marblecliffaltar1_runestone_text: "Те, що лежить на вівтарі, — не твоє. Воно належить тим, хто кружляє у височині й чекає в тиші. Візьми його — і смертоносний ріг розірве мовчання туману."

# Port Runestones
mwl_port1_runestone: Крадіжка Дрелтора
mwl_port1_runestone_text: "Проклятий будь Дрелтор Жадібний, король двергрів у Золоту Добу. Бо саме він, спраглий знань, викрав Око Одіна з Колодязя Міміра. Зганьблені води отруїли Іґґдрасіль, і хворі пагони його впали у Вальхейм, накликавши гнів самого Одіна."

mwl_port2_runestone: Ми — Двергри
mwl_port2_runestone_text: "Проклятий будь Дрелтор Жадібний! Наші великі цивілізації будувались тисячу років і впали за мить. Наші міста, торговельні осередки, фортеці й угіддя спустошені проклятими. Навіщо ж тоді ми тримаємось? Задля чого зберігаємо наші маленькі фортеці й табори в ці безнадійні часи? Бо ми — Двергри! І навіть гнів Одіна нас не зломить. Ми виживемо. Ми відбудуємось. Ми повернемо ласку Одіна. Ми створимо нову золоту добу."

mwl_port3_runestone: Насіння нової ери
mwl_port3_runestone_text: "Навіщо утримувати ці порти — реліквії колись великої епохи, що давно минула? Вони не служать нічому, крім рідкісного заробітку з мандрівних прочан. Але вони знадобляться нам, коли ми почнемо відродження! Коли великі держави двергрів постануть знову, нам буде потрібна торгівля й обмін! Це насіння нової ери, і воно розквітне!\n\nАх, і — проклятий будь Дрелтор Жадібний."

mwl_port4_runestone: Королівства в руїнах
mwl_port4_runestone_text: "Проклятий будь Дрелтор Жадібний, що занурив наші квітучі держави двергрів у руїни, розгнівавши Одіна. Всебатько скинув у наш світ найлютіших своїх відступників і загублені душі — на кару і їм, і нам. Наші королівства розсипались. Колись живі землі вкрилися туманом і вогнем. Наш народ розпорошився й лишився без проводирів."

mwl_port5_runestone: Жаль Дрелтора
mwl_port5_runestone_text: "Я — Дрелтор, колишній король двергрів. У своїй гордині я викрав Око Одіна й накликав нашу загибель. Іронія в тому, що Око дарувало мені мудрість зрозуміти: мені ніколи не слід було його красти. Якби тільки можна було відмотати скоєне! Але це сталося. Мені не лишилось нічого, крім вічних поневірянь. Бо Око прокляло мене безсмертям. Щоб я міг споглядати нескінченні страждання свого народу й загибель усього, чим я правив.\n\nПроклятий будь я сам."

