# Port trader dialogue — random talk
msg_randomPortTalk_1: "Ах, ще один довгоногий хоче мої кораблі? Не спіткнись на причалі, людино."
msg_randomPortTalk_2: "Спершу монета, потім вантаж. Такий закон моря — і закон моєї бороди!"
msg_randomPortTalk_3: "Є що перевезти? Мої човни прудкіші, ніж запах троля за вітром."
msg_randomPortTalk_4: "Люди завжди хочуть усе вчора. Щастить тобі — я вожу завтрашні вантажі вже сьогодні!"
msg_randomPortTalk_5: "Платиш — везу. Просто, як замах молотом, тільки тихіше."
msg_randomPortTalk_6: "Руки подалі від барилів з ромом — то для команди, не для вантажу!"
msg_randomPortTalk_7: "Клянусь бородою, я возив речі й важчі! Не хвилюйся, вантаж дістанеться."
msg_randomPortTalk_8: "Порти, накладні й монети. Ось моє життя. А твоє, людино?"

# Port trader dialogue — greets
msg_randomGreet_1: "Здоров, довгоногий! Прийшов відправити своє блискуче добро за море?"
msg_randomGreet_2: "Ха! Ще один покупець! Дивись під ноги — мотузки валять таких високих, як ти."
msg_randomGreet_3: "Попутний вітер віє, а з ним і вигідні угоди — якщо монета знайдеться."
msg_randomGreet_4: "Клянусь бородою, виглядаєш заморений. Пощастило тобі — я якраз займаюсь дорогами."
msg_randomGreet_5: "Живіше, людино! Мої причали не для зівак."
msg_randomGreet_6: "Доброго дня! Є вантаж? У мене є кораблі."
msg_randomGreet_7: "Ах, запах монет на вітрі. Є діло, га?"
msg_randomGreet_8: "Ласкаво просимо до мого порту! Не чіпай нічого блискучого — якщо тільки не купив."

# Port trader dialogue — goodbyes
msg_randomGoodbye_1: "Попутного вітру, і не потопи мій прибуток!"
msg_randomGoodbye_2: "Ступай тоді — кораблі самі себе не завантажать."
msg_randomGoodbye_3: "Щасливої дороги, довгоногий. Наступного разу витрачай більше монет!"
msg_randomGoodbye_4: "Бережись моря — воно лютіше за мого дядька після трьох кухлів елю."
msg_randomGoodbye_5: "Вантаж чекати не буде. Давай, рушай!"
msg_randomGoodbye_6: "До наступного припливу. Хай чоботи лишаться сухими."
msg_randomGoodbye_7: "Не зникай — і вже тим паче не приходь боржником."
msg_randomGoodbye_8: "Прощавай, і хай борода твоя росте так само міцно, як твій гаманець."