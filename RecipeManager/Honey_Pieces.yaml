pieceModifications:
  piece_apiary:
    action: Modify
    prefab: piece_apiary
    requirements:
    - prefab: Wood
      amount: 21
    - prefab: Honey
      amount: 12
    - prefab: QueenBee
      amount: 3
    requiredToPlaceCraftingStation: piece_workbench
    canBeDeconstructed: true
    pieceCategory: Crafting
    pieceName: $custom_piece_apiary
    pieceDescription: $custom_piece_apiary_description
    enablePiece: true
  apiary_ext1:
