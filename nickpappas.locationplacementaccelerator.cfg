## Settings file was created by plugin Location Placement Accelerator v1.0.24
## Plugin GUID: nickpappas.locationplacementaccelerator

[1 - General]

## Controls the overall placement strategy.
## 
##   Vanilla  - Unmodified Logic. The mod adds placement logging and smart
##              recovery only. World generation is identical to vanilla.
##   Filter   - Vanilla Logic + Spatial Constraints. Rejects candidate zones
##              that fall outside each location's Min/Max distance ring.
##              Requires the transpiled engine (see section 2).
##   Force    - Vanilla Logic + Spatial Constraints. Mathematically generates
##              candidate zones inside the distance ring rather than filtering.
##              Requires the transpiled engine (see section 2).
##   Survey   - Full engine. Pre-scans the world, builds sorted candidate lists
##              per biome and altitude. Required for parallel placement.
##              Recommended for all modded worlds.
## 
## OVERRIDE: Parallel Placement (section 2) forces Survey regardless of this setting.
## OVERRIDE: Filter and Force force the transpiled engine regardless of section 2 settings.
## OVERRIDE: Vanilla forces the transpiled engine.
# Setting type: PlacementMode
# Default value: Survey
# Acceptable values: Vanilla, Filter, Force, Survey
PlacementMode = Survey

## Show the on-screen placement progress overlay during world generation.
## Set to false to disable the overlay entirely.
# Setting type: Boolean
# Default value: true
ShowGui = true

[2 - Engine]

## false - Replaced engine. Uses pre-built candidate lists and spatial exclusion
##         grids for faster, higher-quality placement. Recommended.
## true  - Transpiled engine. Full original patch surface. Required for Filter
##         and Force modes.
## 
## OVERRIDE: Parallel Placement ON forces the replaced engine regardless of this setting.
## OVERRIDE: Filter, Force, or Vanilla mode forces the transpiled engine regardless of this setting.
## Changing this requires a full game restart.
# Setting type: Boolean
# Default value: false
UseLegacyEngine = false

## Enables multi-threaded placement. Multiple location types are placed
## simultaneously, dramatically reducing world generation time on multi-core
## systems.
## 
## ON by default. When ON:
##   - Forces Survey mode regardless of the PlacementMode setting.
##   - Forces the replaced engine regardless of the UseLegacyEngine setting.
##   - Eliminates determinism: each generation run of the same seed produces a different placement
##     layout (placement order is no longer fixed).
## 
## Changing this requires a full game restart.
# Setting type: Boolean
# Default value: true
EnableParallelPlacement = true

## Splits each location type's total quantity into individual work packets
## and interleaves them across all types, rather than placing all of one type
## before moving to the next.
## 
## Can reduce spatial clustering when many of the same type compete for the
## same regions. OFF by default.
## 
## WARNING: Changes the deterministic layout of the world.
# Setting type: Boolean
# Default value: false
EnableInterleavedScheduling = true

[3 - Placement]

## Number of sample points per side of each zone during the pre-scan.
## Only applies in Survey mode.
## 
##   1 - One dart at the zone center. Fastest. Default.
##   3 - 3x3 = 9 darts spread across the zone.
##   5 - 5x5 = 25 darts.
## 
## Must be an odd number (sampling is balanced around the center).
## Even values are rounded up to the nearest odd number automatically.
## Higher values improve altitude and biome accuracy at the cost of scan time.
# Setting type: Int32
# Default value: 1
ScanResolution = 1

## Number of passes through the candidate zone list per placement attempt.
## Only applies in Survey mode.
## 
## At 1, each candidate zone is examined at most once per location type.
## Higher values allow re-examination of zones already visited, which can
## improve placement success in constrained worlds at the cost of additional
## time. Works together with the Iteration Budget settings (section 4).
# Setting type: Int32
# Default value: 1
VisitLimit = 1

[4 - Iteration Budgets]

## Multiplies the maximum number of candidate zones examined before giving up
## on a single placement attempt. Applies in all modes.
## 
## 1.0 = vanilla budget. 2.0 = twice as many zones examined.
## 0.5 = half the budget. 0.0 = disables placement entirely.
## Accepts decimals.
# Setting type: Single
# Default value: 1
OuterLoopMultiplier = 2

## Multiplies the maximum number of placement attempts within a single zone.
## Applies in all modes.
## 
## 1.0 = vanilla budget. 0.0 = disables placement entirely.
## Accepts decimals.
## 
## Note: VisitLimit and these budgets interact. A high VisitLimit with a high
## OuterLoopMultiplier can significantly extend placement time.
# Setting type: Single
# Default value: 1
InnerLoopMultiplier = 1.5

[5 - Smart Recovery]

## When a critical location type cannot be placed, the engine automatically
## relaxes its placement constraints and retries. This setting controls how
## many retry attempts are made before giving up.
## 
## 0 = disables smart recovery entirely.
## 
## Critical types covered (must place at least 1):
##   Eikthyrnir, GDKing, Bonemass, Dragonqueen, GoblinKing,
##   Mistlands_DvergrBossEntrance1, FaderLocation, Vendor_BlackForest,
##   Hildir_camp, BogWitch_Camp, Hildir_crypt, Hildir_cave,
##   Hildir_plainsfortress
## 
## Important types covered (must place at least 50%):
##   Crypt, SunkenCrypt, MountainCave, InfestedMine, TarPit, CharredFortress
# Setting type: Int32
# Default value: 4
MaxRelaxationAttempts = 8

## Fraction of each original placement constraint to relax per retry attempt.
## 0.05 = 5% per attempt. At 4 attempts, up to 20% total relaxation.
## Increase if smart recovery is failing to find placements.
# Setting type: Single
# Default value: 0.05
RelaxationMagnitude = 0.1

[6 - Logging]

## Write the generation log to a file in the BepInEx folder.
## The file contains the full run configuration and per-location placement
## results. Useful for diagnosing placement failures.
# Setting type: Boolean
# Default value: true
WriteToFile = true

## Controls the name of the log file written each run.
## 
## false - Log file is always named LocationPlacementAccelerator.log.
##         Overwrites the previous run's file each time. Default.
## true  - Log file name includes a fingerprint of the run configuration
##         and a timestamp. Multiple runs produce separate files.
# Setting type: Boolean
# Default value: false
VerboseLogFileName = false

## Log each successfully placed location type to the console.
## OFF by default. Failures and smart recovery events are always logged.
# Setting type: Boolean
# Default value: false
LogSuccess = false

## When ON, suppresses per-location placement detail in the log file.
## The run configuration header and final world summary are always written.
## 
## NOTE: Changing this requires a full game restart.
# Setting type: Boolean
# Default value: false
MinimalLogging = false

## Enables verbose diagnostic output. Intended for mod development.
## Leave OFF unless investigating a specific problem.
# Setting type: Boolean
# Default value: false
DiagnosticMode = false

## Log a heartbeat every N zone candidates examined (outer loop).
## 0 = disabled. Only meaningful when DiagnosticMode is ON.
# Setting type: Int32
# Default value: 0
ProgressInterval = 0

## Log a heartbeat every N placement attempts within a zone (inner loop).
## 0 = disabled. Only meaningful when DiagnosticMode is ON.
# Setting type: Int32
# Default value: 0
InnerProgressInterval = 0

[7 - Advanced]

## Only applies when using the replaced engine.
## 
## Cell size in metres for the spatial exclusion grid used to enforce minimum
## distances between similar location types.
## 
## Smaller values = finer resolution = higher memory use.
## THAT IS: the smaller the better your success rate.
## Minimum: 4m. Default 16m uses approximately 4.9 MB per location group
## at maximum world radius.
# Setting type: Single
# Default value: 16
PresenceGridCellSize = 16

## Only applies when using the replaced engine.
## 
## When ON, Mountain and Mistlands similarity checks use 3D distance
## verification when the 2D exclusion grid reports a conflict. This reduces
## false positives in high-relief terrain at the cost of additional lookups.
## 
## OFF by default. The 2D grid is conservative (never misses real conflicts)
## so this only affects placement success rates in mountainous terrain.
# Setting type: Boolean
# Default value: false
Enable3DSimilarityCheck = false

## Only applies in Vanilla mode.
## 
## When ON (default), two performance optimizations remain active even in Vanilla mode:
##   - HaveLocationInRange uses a zone-neighborhood lookup (O(K)) instead of a
##     full world scan (O(N)).
##   - The inner placement loop checks similarity before terrain delta, saving
##     terrain height samples on darts that would fail similarity anyway.
## 
## Both optimizations are correctness-neutral: placement results are identical to
## unmodified Valheim. Leave ON unless benchmarking against true vanilla.
# Setting type: Boolean
# Default value: true
OptimizePlacementChecks = true

## Only applies to the parallel (multi-threaded) replaced engine.
## 
## OFF by default. When OFF, placement is fast and this is how the engine
## has always behaved. The cost: two same-group locations may rarely spawn closer
## than minDistanceFromSimilar, something around 5 pairs per 1,000 locations in tightly-packed groups on a
## vanilla-density world. When it happens the error may be of any magnitude: adjacent partitions touch, so the
## pair can land anywhere from basically touching to the correct minDistanceFromSimilar apart minus a meter.
## For Mistlands Giants for example out of 87990 pairwise comparisons, there was one pair that was 160.77m aparat instead of 250m 
## 
## When ON, the engine guarantees minDistanceFromSimilar to within
## the exclusion grid's cell diagonal (a few metres) under multithreading.
## The cost is about 25% of placement time, and that percentage holds as worlds grow.
## Turn ON only if you cannot tolerate the rare large violation described above.
## I set the default to off because the tradeoff 25% slower for maybe 5 out of 1000 locations not exact 
## is not worth it in my opinion.
## But if you want absolute adherence with just a few + or - a meter or so, then turn this to true. 
## 
## NOTE: Changing this requires a full game restart.
# Setting type: Boolean
# Default value: false
ParallelExactSpacing = false

