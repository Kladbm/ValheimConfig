## Settings file was created by plugin SkillsSorter v1.0.1
## Plugin GUID: Kladbm.SkillsSorter

[_Debug]

## Generate additional debug information in the logs for this mod.
## This will cause a performance hit and should only be used for debugging.
# Setting type: Boolean
# Default value: false
Enable Logging = false

[LiveUpdate]

## Disabled — updates only on menu open.
## Enabled — updates on skill level up or gear change.
## EnabledExceptRunSkill — same, but ignores the Run skill to avoid constant redraws.
# Setting type: LiveUpdateMode
# Default value: EnabledExceptRunSkill
# Acceptable values: Disabled, Enabled, EnabledExceptRunSkill
LiveUpdateMode = Disabled

[Sorting]

## Disabled — original order.
## ByName — alphabetical.
## ByLevel — highest level first, ties broken by name.
# Setting type: SortMode
# Default value: ByLevel
# Acceptable values: Disabled, ByName, ByLevel
SortMode = ByLevel

## true — highest level at the top, false — lowest level at the top.
# Setting type: Boolean
# Default value: true
DescendingLevel = true

