# Port trader dialogue — random talk
msg_randomPortTalk_1: "Ах, ещё один длинноногий хочет мои корабли? Не споткнись о причал, человек."
msg_randomPortTalk_2: "Сначала монета, потом груз. Таков закон моря — и закон моей бороды!"
msg_randomPortTalk_3: "Есть что перевезти? Мои лодки шустрее, чем запах тролля по ветру."
msg_randomPortTalk_4: "Люди всегда хотят всё вчера. Повезло тебе — я вожу завтрашние грузы уже сегодня!"
msg_randomPortTalk_5: "Платишь — вожу. Просто, как замах молотом, только тише."
msg_randomPortTalk_6: "Руки подальше от бочек с ромом — это для команды, а не для груза!"
msg_randomPortTalk_7: "Клянусь бородой, я перевозил вещи и потяжелее! Не переживай, груз доберётся."
msg_randomPortTalk_8: "Порты, накладные и монеты. Вот моя жизнь. А твоя, человек?"

# Port trader dialogue — greets
msg_randomGreet_1: "Здорово, длинноногий! Пришёл отправить блестяшки за море?"
msg_randomGreet_2: "Ха! Ещё один покупатель! Гляди под ноги — верёвки валят таких высоких, как ты."
msg_randomGreet_3: "Попутный ветер дует, а с ним и выгодные сделки — если монета найдётся."
msg_randomGreet_4: "Клянусь бородой, выглядишь замотанным. Повезло тебе — я как раз в дороге разбираюсь."
msg_randomGreet_5: "Живее, человек! Мои причалы не для зевак."
msg_randomGreet_6: "Доброго дня! Есть груз? У меня есть корабли."
msg_randomGreet_7: "Ах, запах монет на ветру. Дело есть, а?"
msg_randomGreet_8: "Добро пожаловать в мой порт! Не трогай ничего блестящего — если только не купил."

# Port trader dialogue — goodbyes
msg_randomGoodbye_1: "Попутного ветра, и не потопи мою прибыль!"
msg_randomGoodbye_2: "Ступай тогда — корабли сами себя не загрузят."
msg_randomGoodbye_3: "Удачи в пути, длинноногий. В следующий раз трать больше монет!"
msg_randomGoodbye_4: "Берегись моря — оно злее моего дяди после трёх кружек эля."
msg_randomGoodbye_5: "Груз ждать не будет. Давай, шагай!"
msg_randomGoodbye_6: "До следующего прилива. Пусть сапоги останутся сухими."
msg_randomGoodbye_7: "Не пропадай — и уж тем более не приходи должником."
msg_randomGoodbye_8: "Прощай, и пусть борода твоя растёт так же крепко, как твой кошелёк."
