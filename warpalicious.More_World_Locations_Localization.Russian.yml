# Marble Jail 1
mwl_marblejail1_key: Ключ от мраморной темницы
mwl_marblejail1_key_desc: Ржавый железный ключ, стёртый от времени. Открывает камерный блок.
mwl_marblejail1_runestone: Мрачный конец
mwl_marblejail1_runestone_text: "Они забыли меня здесь. Годы превратились в десятилетия. Твари внизу стали привычными — их вой был моей единственной компанией. Я иду к ним теперь. Они ждали меня. Никто другой не ждал."
 
# Marble Cliff Altar 1
mwl_marblecliffaltar1_runestone: Опасное приобретение
mwl_marblecliffaltar1_runestone_text: "То, что лежит на алтаре, — не твоё. Оно принадлежит тем, кто кружит в вышине и ждёт в тишине. Возьми его — и смертоносный рог разорвёт безмолвие тумана."

# Port Runestones
mwl_port1_runestone: Кража Дрелтора
mwl_port1_runestone_text: "Проклят будь Дрелтор Алчный, король двергров в Золотой Век. Ибо он, снедаемый жаждой знания, похитил Око Одина из Колодца Мимира. Осквернённые воды отравили Иггдрасиль, и больные побеги его упали в Вальхейм, навлекая гнев самого Одина."
 
mwl_port2_runestone: Мы — Двергры
mwl_port2_runestone_text: "Проклят будь Дрелтор Алчный! Наши великие цивилизации строились тысячу лет и рухнули в мгновение ока. Наши города, торговые центры, крепости и угодья разрушены проклятыми. Зачем же тогда мы держимся? Ради чего сохраняем наши маленькие крепости и лагери в эти безнадёжные времена? Потому что мы — Двергры! И даже гнев Одина не сломит нас. Мы выживем. Мы отстроимся. Мы вернём благосклонность Одина. Мы создадим новый золотой век."
 
mwl_port3_runestone: Семена новой эпохи
mwl_port3_runestone_text: "Зачем содержать эти порты — реликвии некогда великой эпохи, давно миновавшей? Они не служат ничему, кроме редкого заработка с проходящих кочевников. Но они понадобятся нам, когда мы начнём возрождение! Когда великие державы двергров поднимутся вновь, нам будет нужна торговля и commerce! Это семена новой эпохи, и они расцветут!\n\nА, да — проклят будь Дрелтор Алчный."
 
mwl_port4_runestone: Королевства в руинах
mwl_port4_runestone_text: "Проклят будь Дрелтор Алчный, погрузивший наши процветающие державы двергров в руины, разгневав Одина. Всеотец обрушил на наш мир самых злобных своих отверженных и потерянные души — в наказание и им, и нам. Наши королевства рассыпались. Некогда живые земли заволокло туманом и огнём. Наш народ рассеялся и остался без вождей."
 
mwl_port5_runestone: Сожаление Дрелтора
mwl_port5_runestone_text: "Я — Дрелтор, бывший король двергров. В своей гордыне я похитил Око Одина и навлёк на нас гибель. Ирония в том, что Oko даровало мне мудрость понять: мне никогда не следовало его красть. Если бы только можно было отменить содеянное! Но это свершилось. Мне не осталось ничего, кроме вечных странствий. Ибо Oko проклял меня бессмертием. Чтобы я мог наблюдать бесконечные страдания своего народа и гибель всего, чем я правил.\n\nПроклят будь я сам."

